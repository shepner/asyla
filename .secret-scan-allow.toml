# False positives of the hub's core/tools/scan_git_secrets.py in this repo (format: that script's docstring).
# An entry names where a finding is, never its value.
# (asyla #630, 2026-11-20: the two earlier entries matched nothing any more and were removed.)

# The d06 mail relay's OpenBao token-role name, from theOrg communications DEPLOY.md "Mail relay on
# d06" at aa1af97a: a role name, not a credential (only asyla-redeploy-apps may mint from it, wrapped,
# 1-300 s). Operator 2026-11-23, answering "May I add an allow entry for that finding": "Yes, allow it".
[[allow]]
path = "d06/apps/communications/compose.yml"
kind = "generic-secret-assignment"
key = "MAIL_RELAY_TOKEN_ROLE"
reason = "OpenBao token-role name in theOrg's relay contract, not a secret (asyla #657)"

[[allow]]
path = "scripts/tests/test_communications_sh.sh"
kind = "generic-secret-assignment"
key = "MAIL_RELAY_TOKEN_ROLE"
reason = "the test asserts the role-name line above is the relay's only token-named setting (asyla #657)"
