# Cloudflare Tunnel (cloudflared) for d01
# Provides internet access to d01 applications via Cloudflare Tunnel
#
# Setup:
# 1. Create tunnel in Cloudflare Zero Trust dashboard, get TUNNEL_TOKEN
# 2. Set TUNNEL_TOKEN in /mnt/docker/cloudflared/.env on d01 (mode 600; copy from .env.example)
# 3. Add app networks to the networks list below as apps are added
# 4. Configure Public Hostnames in Cloudflare dashboard

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-d01
    restart: unless-stopped
    # Token mode (from setup-tunnel-api.py or dashboard): config is remote
    command: ["tunnel", "run", "--token", "${TUNNEL_TOKEN}"]
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      # Metrics and /ready on loopback only; `cloudflared tunnel ready` (the healthcheck) reads the
      # same variable: exit 0 at the live address, 1 at a dead port (d01, cloudflared 2026.10.1,
      # 2026-10-20). /ready is 200 only while the tunnel has a connection to Cloudflare.
      - TUNNEL_METRICS=127.0.0.1:20241
    # Healthcheck: asyla backlog 2026-10-20-hosts-observability-through-theorg (operator, 2026-10-20).
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Attach to app networks so tunnel can reach services
    networks:
      - d01_internal
      - media_net
      - calibre_net
      - homebridge_net
      - duplicati_net
      - breeding_program_net

networks:
  d01_internal:
    external: true
    name: d01_internal
  media_net:
    external: true
    name: media_net
  calibre_net:
    external: true
    name: calibre_net
  homebridge_net:
    external: true
    name: homebridge_net
  duplicati_net:
    external: true
    name: duplicati_net
  breeding_program_net:
    external: true
    name: breeding_program_net
