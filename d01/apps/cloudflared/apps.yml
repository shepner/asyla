# Cloudflare Tunnel Applications Configuration for d01
# Single source of truth for all apps exposed via d01 tunnel
#
# Add entries as apps are deployed. Schema:
#   domain: Base domain (e.g. asyla.org)
#   apps:
#     - app: Application name (Docker network: {app}_net)
#       hostname: Subdomain (full hostname = {hostname}.{domain})
#       service: Docker service/container name
#       port: Port the service listens on
#       access: true/false - Enable Cloudflare Access (default: true)
#
# Publishing on d01 today is one name at a time, with external-access scripts/public-hostname.py add
# (asyla/projects/external-access; ingress rule, DNS record and Access hostname, nothing else changed).
# Do not run setup-tunnel-api.py against the live tunnel: it publishes every entry below (homebridge,
# cameraui and duplicati are listed but deliberately not public) and replaces the tunnel's whole config
# (dropping warp-routing) and the "d01 media" Access app (session, identity providers).

domain: asyla.org

apps:
  - app: media
    hostname: sonarr
    service: sonarr
    port: 8989
    access: true
  - app: media
    hostname: radarr
    service: radarr
    port: 7878
    access: true
  - app: media
    hostname: overseerr
    service: overseerr
    port: 5055
    access: true
  - app: media
    hostname: jackett
    service: jackett
    port: 9117
    access: true
  - app: media
    hostname: transmission
    service: transmission
    port: 9091
    access: true
  - app: media
    hostname: where-to-stream
    service: where-to-stream
    port: 8080
    access: true
  - app: calibre
    hostname: calibre
    service: calibre
    port: 8080
    access: true
  - app: homebridge
    hostname: homebridge
    service: homebridge-proxy
    port: 8581
    access: true
  - app: homebridge
    hostname: cameraui
    service: cameraui-proxy
    port: 8181
    access: true
  - app: duplicati
    hostname: duplicati
    service: duplicati
    port: 8200
    access: true
  - app: breeding_program
    hostname: breeding-program
    service: breeding-program
    port: 8080
    # Own Access application (one-time PIN, email list), managed by
    # d01/apps/breeding-program/cloudflare-access.py; not part of the shared app.
    access: false
