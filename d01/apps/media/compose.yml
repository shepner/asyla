# Media stack on d01: Sonarr, Radarr, Overseerr, Jackett, Transmission, where-to-stream
# Working dirs under /mnt/docker (sonarr, radarr, overseerr, jackett, transmission, where-to-stream).
# where-to-stream (personal project, gitea personal/where-to-stream): stock python image running the
# source that push-where-to-stream.sh ships to /mnt/docker/where-to-stream/src; reads the Radarr,
# Sonarr and Overseerr databases read-only and serves a page of where the wishlist streams.
# Run: ~/scripts/d01/apps/media/media.sh up
# Access via cloudflared tunnel or internal proxy (no published ports except Transmission peer port).
# Requires: DOCKER_DL (/mnt/docker), DOCKER_UID, DOCKER_GID, LOCAL_TZ; /mnt/nas/data1/media for library.
# Note: media.sh automatically sources ~/scripts/docker/common.env if it exists.

networks:
  media_net:
    name: media_net
    driver: bridge

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    # Healthcheck: asyla backlog 2026-10-20-hosts-observability-through-theorg (operator, 2026-10-20).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8989/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - transmission
      - jackett
    environment:
      - PUID=${DOCKER_UID:-1003}
      - PGID=${DOCKER_GID:-1000}
      - TZ=${LOCAL_TZ:-America/Chicago}
      # Since Sonarr 4.0.20 a request that still carries X-Forwarded-For must log in, even from the
      # LAN ("Disabled for Local Addresses" no longer applies). The header is only consumed when the
      # proxy that sent it is listed here: the Docker bridge ranges, where Caddy and cloudflared sit.
      - SONARR__SERVER__TRUSTEDNETWORKS=172.16.0.0/12
    volumes:
      - ${DOCKER_DL:-/mnt/docker}/sonarr/config:/config
      - ${DATA1:-/mnt/nas/data1}/media/Videos:/tv
      - ${DOCKER_DL:-/mnt/docker}/transmission/downloads/complete:/downloads
    networks:
      - media_net

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - transmission
      - jackett
    environment:
      - PUID=${DOCKER_UID:-1003}
      - PGID=${DOCKER_GID:-1000}
      - TZ=${LOCAL_TZ:-America/Chicago}
      # Radarr (seen on 6.4.4): a request that still carries X-Forwarded-For must log in, even from the
      # LAN ("Disabled for Local Addresses" no longer applies). The header is only consumed when the
      # proxy that sent it is listed here: the Docker bridge ranges, where Caddy and cloudflared sit.
      - RADARR__SERVER__TRUSTEDNETWORKS=172.16.0.0/12
    volumes:
      - ${DOCKER_DL:-/mnt/docker}/radarr/config:/config
      - ${DATA1:-/mnt/nas/data1}/media/Videos:/movies
      - ${DOCKER_DL:-/mnt/docker}/transmission/downloads/complete:/downloads
    networks:
      - media_net

  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5055/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - sonarr
      - radarr
    environment:
      - PUID=${DOCKER_UID:-1003}
      - PGID=${DOCKER_GID:-1000}
      - TZ=${LOCAL_TZ:-America/Chicago}
    volumes:
      - ${DOCKER_DL:-/mnt/docker}/overseerr/config:/config
    networks:
      - media_net
    # Plex is on d02:32400; use http://d02:32400 in Overseerr settings (resolved via host DNS / asyla.org)

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9117/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - transmission
    environment:
      - PUID=${DOCKER_UID:-1003}
      - PGID=${DOCKER_GID:-1000}
      - TZ=${LOCAL_TZ:-America/Chicago}
      - AUTO_UPDATE=true
    volumes:
      - ${DOCKER_DL:-/mnt/docker}/jackett/config:/config
      - ${DOCKER_DL:-/mnt/docker}/jackett/downloads:/downloads
    networks:
      - media_net

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9091/transmission/web/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - PUID=${DOCKER_UID:-1003}
      - PGID=${DOCKER_GID:-1000}
      - TZ=${LOCAL_TZ:-America/Chicago}
      - TRANSMISSION_DOWNLOAD_DIR=/downloads/complete
      - TRANSMISSION_INCOMPLETE_DIR=/downloads/incomplete
      - TRANSMISSION_INCOMPLETE_DIR_ENABLED=true
    volumes:
      - ${DOCKER_DL:-/mnt/docker}/transmission/config:/config
      - ${DOCKER_DL:-/mnt/docker}/transmission/watch:/watch
      - ${DOCKER_DL:-/mnt/docker}/transmission/downloads:/downloads
    networks:
      - media_net
    # Peer port for incoming torrents (port-forward on router); WebUI via proxy
    ports:
      - "51413:51413"
      - "51413:51413/udp"

  # Personal project (~/local/personal/projects/where-to-stream; README "Container (d01 media stack)").
  # No image is built: python:3.13-alpine runs /app, the source push-where-to-stream.sh ships (git
  # archive of its HEAD). The three apps' config dirs are mounted read-only as directories, not files:
  # their SQLite databases are in WAL mode and need the -wal/-shm files beside them. Everything it
  # writes (JustWatch cache, the page) goes to /data. Outbound HTTPS to apis.justwatch.com.
  where-to-stream:
    image: python:3.13-alpine
    container_name: where-to-stream
    restart: unless-stopped
    command: ["python3", "/app/serve.py"]
    user: "${DOCKER_UID:-1003}:${DOCKER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - radarr
      - sonarr
      - overseerr
    environment:
      - TZ=${LOCAL_TZ:-America/Chicago}
    volumes:
      - ${DOCKER_DL:-/mnt/docker}/where-to-stream/src:/app:ro
      - ${DOCKER_DL:-/mnt/docker}/radarr/config:/dbs/radarr:ro
      - ${DOCKER_DL:-/mnt/docker}/sonarr/config:/dbs/sonarr:ro
      - ${DOCKER_DL:-/mnt/docker}/overseerr/config/db:/dbs/overseerr:ro
      - ${DOCKER_DL:-/mnt/docker}/where-to-stream/data:/data
    networks:
      - media_net
    # Port 8080, not published: cloudflared-d01 and caddy-internal-d01 reach it on media_net.
