# HVAC cold-spell report (asyla backlog
# 2026-10-27-home-automation-hvac-schedule-optimiser-lowest-energy-heating-and-cooling-sc).
# home-assistant.sh up installs this folder as config/packages/ on every start: edit it here.
# Read-only: it reports, it changes no thermostat. At a cold spell (24 h low below 0 °C at the
# Ambient Weather station) Home Assistant runs asyla/report_hvac_cycles.py --days 7 and mails the
# report, at most once in 7 days after a successful one, so through a cold winter it is the weekly
# report. A failed run (Prometheus down) does not count: the next day's 09:00 tries again.

sensor:
  # Lowest outdoor temperature over the last 24 h. Samples are state changes of the station sensor;
  # keep_last_sample keeps a value through a day with no change.
  - platform: statistics
    name: "MKE temperature 24 h minimum"
    unique_id: asyla_hvac_mke_temperature_min_24h
    entity_id: sensor.mke_temperature
    state_characteristic: value_min
    max_age:
      hours: 24
    keep_last_sample: true
    precision: 1

# No template in the command, so Home Assistant runs it through the shell. It must finish within
# shell_command's 60 s (a 7-day report took 0.5 s from WS01 on 2026-10-28); the script gives each
# request 10 s and itself 45 s, then exits 2 with its own [ERROR] line.
shell_command:
  hvac_cycle_report: python3 /config/asyla/report_hvac_cycles.py --days 7

# When the last report succeeded (local time). No `initial`, so Home Assistant restores it at start
# (input_datetime is a RestoreEntity). With nothing to restore it starts as today 00:00:00, which the
# gate reads as never set: a report sets it at 09:00 or whenever it is run, never at 00:00:00.
input_datetime:
  hvac_cold_spell_report_last_success:
    name: "HVAC cold-spell report last success"
    has_date: true
    has_time: true

automation:
  - id: asyla_hvac_cold_spell_report
    alias: "HVAC cold-spell report"
    description: >-
      At 09:00, when the 24 h outdoor low is below 0 °C and the last successful report is at
      least 7 days old (by date), run report_hvac_cycles.py --days 7 and mail its output to
      notify.hvac_report. Only a successful run sets input_datetime.hvac_cold_spell_report_last_success,
      so a failed one is retried the next day. Run actions from the UI to send one now (that skips
      the conditions).
    mode: single
    triggers:
      - trigger: time
        at: "09:00:00"
    conditions:
      # The 24 h low in °C, by the sensor's unit: it follows sensor.mke_temperature, which reads
      # °F on d01, so a bare `below: 0` meant below -17.8 °C. Another unit, or no number, renders
      # none, which numeric_state counts as false.
      - condition: numeric_state
        entity_id: sensor.mke_temperature_24_h_minimum
        value_template: >-
          {%- set v = state.state | float(none) -%}
          {%- set u = state.attributes.unit_of_measurement -%}
          {{ none if v is none else (v - 32) * 5 / 9 if u == '°F' else v if u == '°C' else none }}
        below: 0
      # The last successful report, by local date, so a report at 09:00:00.2 does not block the
      # next one. Unknown, unavailable or the 00:00:00 start value (never set) count as no report.
      - condition: template
        value_template: >-
          {% set s = states('input_datetime.hvac_cold_spell_report_last_success') %}
          {% set last = strptime(s, '%Y-%m-%d %H:%M:%S', none) %}
          {{ last is none or s.endswith(' 00:00:00') or (now().date() - last.date()).days >= 7 }}
    actions:
      - action: shell_command.hvac_cycle_report
        response_variable: report
        continue_on_error: true
      # Only a run that printed its report counts for the 7 days; a false `if` goes on to the
      # notifications, so a failure is still reported.
      - if:
          - condition: template
            value_template: "{{ report is defined and report.returncode == 0 }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.hvac_cold_spell_report_last_success
            data:
              datetime: "{{ now() }}"
      # The low in both units, by the sensor's unit (its state as it is when that is not °F or °C).
      - variables:
          low: >-
            {%- set e = 'sensor.mke_temperature_24_h_minimum' -%}
            {%- set v = states(e) | float(none) -%}
            {%- set u = state_attr(e, 'unit_of_measurement') -%}
            {%- set c = none if v is none else (v - 32) * 5 / 9 if u == '°F' else v if u == '°C' else none -%}
            {{ states(e) if c is none else '%.1f °F (%.1f °C)' | format(c * 9 / 5 + 32, c) }}
          body: >-
            {% if report is defined and report.returncode == 0 %}{{ report.stdout }}
            {%- elif report is defined %}report_hvac_cycles.py failed (exit {{ report.returncode }}):
            {{ report.stderr }}
            {%- else %}report_hvac_cycles.py did not finish (shell_command error or 60 s timeout; see the Home Assistant log).{% endif %}
      # The UI copy first, so a mail failure still leaves the report in Home Assistant.
      - action: persistent_notification.create
        data:
          notification_id: asyla_hvac_cold_spell_report
          title: "HVAC cold-spell report (24 h low {{ low }})"
          message: "{{ body }}"
      # notify.hvac_report: the SMTP integration's recipient entity, renamed to this id (README).
      - action: notify.send_message
        target:
          entity_id: notify.hvac_report
        data:
          title: "HVAC cold-spell report (24 h low {{ low }})"
          message: "{{ body }}"
