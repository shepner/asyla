# Location names for the Ambient Weather extra sensors (operator, 2026-11-24: "Yes, rename them").
# Home Assistant named them from the station (sensor.mke_*_N, and sensor.outside_mke_*_N for channels
# 3 to 5, a naming accident), so nothing in the UI said where each one is. Only the display name
# (friendly_name) changes: the entity ids stay, so the freezer and sensor-health alerts and the
# trends Prometheus series (labelled by entity id) are untouched.
#
# Placements as the operator stated them (asyla data/home-climate-controls.md, "Ambient Weather
# sensor channels"): 1 greenhouse, 2 kitchen freezer, 3 basement deep freezer, 4 far end of the
# basement, 5 main attic (on a joist above the insulation, from 2026-11-08 16:45Z), the WH32B beside
# the ecobee, and the AQIN Pro air quality monitor in the upstairs bedroom (operator, 2026-11-24:
# "the air quality sensor in the upstairs bedroom"). A sensor moved to a new place needs its names
# changed here and in that data file.

homeassistant:
  customize:
    sensor.mke_temperature_1: {friendly_name: "Greenhouse temperature"}
    sensor.mke_humidity_1: {friendly_name: "Greenhouse humidity"}
    binary_sensor.mke_battery_1: {friendly_name: "Greenhouse sensor battery"}
    sensor.mke_temperature_2: {friendly_name: "Kitchen freezer temperature"}
    sensor.mke_humidity_2: {friendly_name: "Kitchen freezer humidity"}
    binary_sensor.mke_battery_2: {friendly_name: "Kitchen freezer sensor battery"}
    sensor.outside_mke_temperature_3: {friendly_name: "Basement freezer temperature"}
    sensor.outside_mke_humidity_3: {friendly_name: "Basement freezer humidity"}
    binary_sensor.outside_mke_battery_3: {friendly_name: "Basement freezer sensor battery"}
    sensor.outside_mke_temperature_4: {friendly_name: "Basement far end temperature"}
    sensor.outside_mke_humidity_4: {friendly_name: "Basement far end humidity"}
    binary_sensor.outside_mke_battery_4: {friendly_name: "Basement far end sensor battery"}
    sensor.outside_mke_temperature_5: {friendly_name: "Attic temperature"}
    sensor.outside_mke_humidity_5: {friendly_name: "Attic humidity"}
    binary_sensor.outside_mke_battery_5: {friendly_name: "Attic sensor battery"}
    sensor.mke_inside_temperature: {friendly_name: "Main floor (by the ecobee) temperature"}
    sensor.mke_humidity_indoor: {friendly_name: "Main floor (by the ecobee) humidity"}
    # The station's only indoor transmitter is the WH32B, so this is taken to be its battery.
    binary_sensor.mke_interior_battery: {friendly_name: "Main floor (by the ecobee) sensor battery"}
    sensor.outside_mke_indoor_temperature_aqin: {friendly_name: "Upstairs bedroom temperature"}
    sensor.outside_mke_indoor_humidity_aqin: {friendly_name: "Upstairs bedroom humidity"}
    sensor.outside_mke_co2_indoor_aqin: {friendly_name: "Upstairs bedroom CO2"}
    sensor.outside_mke_co2_indoor_24h_average_aqin: {friendly_name: "Upstairs bedroom CO2 24 h average"}
    sensor.outside_mke_pm2_5_indoor_aqin: {friendly_name: "Upstairs bedroom PM2.5"}
    sensor.outside_mke_pm2_5_indoor_24h_aqin: {friendly_name: "Upstairs bedroom PM2.5 24 h average"}
    sensor.outside_mke_pm2_5_indoor_aqi_aqin: {friendly_name: "Upstairs bedroom PM2.5 AQI"}
    sensor.outside_mke_pm2_5_indoor_aqi_24h_average_aqin: {friendly_name: "Upstairs bedroom PM2.5 AQI 24 h average"}
    sensor.outside_mke_pm10_indoor_aqin: {friendly_name: "Upstairs bedroom PM10"}
    sensor.outside_mke_pm10_indoor_24h_average_aqin: {friendly_name: "Upstairs bedroom PM10 24 h average"}
    sensor.outside_mke_pm10_indoor_aqi_aqin: {friendly_name: "Upstairs bedroom PM10 AQI"}
    sensor.outside_mke_pm10_indoor_aqi_24h_average_aqin: {friendly_name: "Upstairs bedroom PM10 AQI 24 h average"}
