# Dry-air advice (asyla backlog
# 2026-11-04-home-automation-dry-air-advice-home-assistant-tells-the-operator-when-to-air).
# home-assistant.sh up installs this folder as config/packages/ on every start: edit it here.
# Advice only: it sends notices and switches no device. Four notices, 08:00-21:00 local only (a
# condition that holds overnight is sent at 08:00): air the house, stop airing, run the basement
# dehumidifier, turn it off. Each carries the live readings in °F and °C and the RH the outdoor air
# reads once warmed to the indoor temperature (asyla memory humidity-advice-quotes-live-readings).
#
# Units: every template converts a temperature by that entity's unit_of_measurement (°F or °C;
# anything else counts as unavailable), because Home Assistant shows temperature-class sensors in
# the system's unit: on d01 the Ecobee and Ambient Weather sensors read °F, and so does
# sensor.indoor_dew_point below although it is computed in °C. Thresholds are in °C.
# Home Assistant has no shared macros without config/custom_templates (not installed by up), so the
# conversion macro `c` is repeated in each template; the tests render every copy.

template:
  - sensor:
      # Magnus formula (a 17.62, b 243.12 °C), from the Ecobee hallway temperature and humidity.
      - name: "Indoor dew point"
        unique_id: asyla_dry_air_indoor_dew_point
        default_entity_id: sensor.indoor_dew_point
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {%- macro c(e) -%}{%- set v = states(e) | float(none) -%}{%- set u = state_attr(e, 'unit_of_measurement') -%}{{- none if v is none else (v - 32) * 5 / 9 if u == '°F' else v if u == '°C' else none -}}{%- endmacro -%}
          {%- set t = c('sensor.downstairs_hallway_temperature') | float(none) -%}
          {%- set rh = states('sensor.downstairs_hallway_humidity') | float(none) -%}
          {{ t is not none and rh is not none and 0 < rh <= 100 }}
        state: >-
          {%- macro c(e) -%}{%- set v = states(e) | float(none) -%}{%- set u = state_attr(e, 'unit_of_measurement') -%}{{- none if v is none else (v - 32) * 5 / 9 if u == '°F' else v if u == '°C' else none -}}{%- endmacro -%}
          {%- set t = c('sensor.downstairs_hallway_temperature') | float(none) -%}
          {%- set rh = states('sensor.downstairs_hallway_humidity') | float(none) -%}
          {%- if t is none or rh is none or not 0 < rh <= 100 -%}{{ none }}{%- else -%}
          {%- set g = log(rh / 100) + 17.62 * t / (243.12 + t) -%}
          {{ (243.12 * g / (17.62 - g)) | round(1) }}
          {%- endif -%}

      # The RH outdoor air reaches once warmed to the indoor temperature (its dew point stays the
      # same): 100 * es(outdoor dew point) / es(indoor temperature). 2026-11-04: 12.2 °C at 83%
      # outdoors (dew point 9.4 °C) against 23.6 °C indoors reads about 41%. At most 100.
      - name: "Outdoor air RH indoors"
        unique_id: asyla_dry_air_outdoor_air_rh_indoors
        default_entity_id: sensor.outdoor_air_rh_indoors
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        availability: >-
          {%- macro c(e) -%}{%- set v = states(e) | float(none) -%}{%- set u = state_attr(e, 'unit_of_measurement') -%}{{- none if v is none else (v - 32) * 5 / 9 if u == '°F' else v if u == '°C' else none -}}{%- endmacro -%}
          {%- set t_in = c('sensor.downstairs_hallway_temperature') | float(none) -%}
          {%- set dp_out = c('sensor.mke_dew_point') | float(none) -%}
          {{ t_in is not none and dp_out is not none }}
        state: >-
          {%- macro c(e) -%}{%- set v = states(e) | float(none) -%}{%- set u = state_attr(e, 'unit_of_measurement') -%}{{- none if v is none else (v - 32) * 5 / 9 if u == '°F' else v if u == '°C' else none -}}{%- endmacro -%}
          {%- set t_in = c('sensor.downstairs_hallway_temperature') | float(none) -%}
          {%- set dp_out = c('sensor.mke_dew_point') | float(none) -%}
          {%- if t_in is none or dp_out is none -%}{{ none }}{%- else -%}
          {{ ([100, 100 * e ** (17.62 * dp_out / (243.12 + dp_out) - 17.62 * t_in / (243.12 + t_in))] | min) | round(0) | int }}
          {%- endif -%}

  - binary_sensor:
      # On when the outdoor dew point is at least 3 °C under the indoor one, it is between 5 °C and
      # the indoor temperature outdoors, and no rain falls; held 30 min before it turns on.
      # `reasons` says why it is off: humid, rain, too cold, warmer outside (or readings
      # unavailable). State and reasons share one preamble, so they cannot disagree.
      - name: "Outdoor air can dry the house"
        unique_id: asyla_dry_air_outdoor_air_can_dry_the_house
        default_entity_id: binary_sensor.outdoor_air_can_dry_the_house
        delay_on:
          minutes: 30
        availability: >-
          {%- macro c(e) -%}{%- set v = states(e) | float(none) -%}{%- set u = state_attr(e, 'unit_of_measurement') -%}{{- none if v is none else (v - 32) * 5 / 9 if u == '°F' else v if u == '°C' else none -}}{%- endmacro -%}
          {%- set t_in = c('sensor.downstairs_hallway_temperature') | float(none) -%}
          {%- set dp_in = c('sensor.indoor_dew_point') | float(none) -%}
          {%- set t_out = c('sensor.mke_temperature') | float(none) -%}
          {%- set dp_out = c('sensor.mke_dew_point') | float(none) -%}
          {%- set rain = states('sensor.mke_precipitation_intensity') | float(none) -%}
          {%- set ok = none not in [t_in, dp_in, t_out, dp_out, rain] -%}
          {%- set r = ['readings unavailable'] if not ok else ((['humid'] if dp_out > dp_in - 3 else []) + (['rain'] if rain > 0 else []) + (['too cold'] if t_out < 5 else []) + (['warmer outside'] if t_out > t_in else [])) -%}
          {{ ok }}
        state: >-
          {%- macro c(e) -%}{%- set v = states(e) | float(none) -%}{%- set u = state_attr(e, 'unit_of_measurement') -%}{{- none if v is none else (v - 32) * 5 / 9 if u == '°F' else v if u == '°C' else none -}}{%- endmacro -%}
          {%- set t_in = c('sensor.downstairs_hallway_temperature') | float(none) -%}
          {%- set dp_in = c('sensor.indoor_dew_point') | float(none) -%}
          {%- set t_out = c('sensor.mke_temperature') | float(none) -%}
          {%- set dp_out = c('sensor.mke_dew_point') | float(none) -%}
          {%- set rain = states('sensor.mke_precipitation_intensity') | float(none) -%}
          {%- set ok = none not in [t_in, dp_in, t_out, dp_out, rain] -%}
          {%- set r = ['readings unavailable'] if not ok else ((['humid'] if dp_out > dp_in - 3 else []) + (['rain'] if rain > 0 else []) + (['too cold'] if t_out < 5 else []) + (['warmer outside'] if t_out > t_in else [])) -%}
          {{ r | count == 0 }}
        attributes:
          reasons: >-
            {%- macro c(e) -%}{%- set v = states(e) | float(none) -%}{%- set u = state_attr(e, 'unit_of_measurement') -%}{{- none if v is none else (v - 32) * 5 / 9 if u == '°F' else v if u == '°C' else none -}}{%- endmacro -%}
            {%- set t_in = c('sensor.downstairs_hallway_temperature') | float(none) -%}
            {%- set dp_in = c('sensor.indoor_dew_point') | float(none) -%}
            {%- set t_out = c('sensor.mke_temperature') | float(none) -%}
            {%- set dp_out = c('sensor.mke_dew_point') | float(none) -%}
            {%- set rain = states('sensor.mke_precipitation_intensity') | float(none) -%}
            {%- set ok = none not in [t_in, dp_in, t_out, dp_out, rain] -%}
            {%- set r = ['readings unavailable'] if not ok else ((['humid'] if dp_out > dp_in - 3 else []) + (['rain'] if rain > 0 else []) + (['too cold'] if t_out < 5 else []) + (['warmer outside'] if t_out > t_in else [])) -%}
            {{ r | join(', ') }}

      # Ecobee hallway RH 60% or more, held 6 h (a dip under 60 starts the 6 h again).
      - name: "Indoor humidity 60% or more for 6 h"
        unique_id: asyla_dry_air_indoor_humidity_high
        default_entity_id: binary_sensor.indoor_humidity_high
        delay_on:
          hours: 6
        availability: "{{ states('sensor.downstairs_hallway_humidity') | is_number }}"
        state: "{{ states('sensor.downstairs_hallway_humidity') | float(0) >= 60 }}"

      # Ecobee hallway RH 50% or less, held 3 h.
      - name: "Indoor humidity 50% or less for 3 h"
        unique_id: asyla_dry_air_indoor_humidity_dry_enough
        default_entity_id: binary_sensor.indoor_humidity_dry_enough
        delay_on:
          hours: 3
        availability: "{{ states('sensor.downstairs_hallway_humidity') | is_number }}"
        state: "{{ states('sensor.downstairs_hallway_humidity') | float(100) <= 50 }}"

# When each notice was last sent (local time). No `initial`, so Home Assistant restores them at
# start. With nothing to restore they start as today 00:00:00: at least 8 h before any notice
# (08:00 on), so "at least 3 h since" holds, "within 3 h of" does not, and the two dehumidifier
# helpers are equal (no "on" outstanding). Missing or unknown counts as 0 (never).
input_datetime:
  dry_air_last_air_notice:
    name: "Dry air: last air-the-house notice"
    has_date: true
    has_time: true
  dry_air_last_stop_notice:
    name: "Dry air: last stop-airing notice"
    has_date: true
    has_time: true
  dry_air_last_dehumidifier_on_notice:
    name: "Dry air: last dehumidifier-on notice"
    has_date: true
    has_time: true
  dry_air_last_dehumidifier_off_notice:
    name: "Dry air: last dehumidifier-off notice"
    has_date: true
    has_time: true

# One notice: a persistent notification (one id per thread, so "stop" replaces "air" in the UI),
# then mail to notify.hvac_report (the cold-spell report's recipient entity, README). Until the SMTP
# integration exists, send_message to it only logs a warning; continue_on_error keeps a mail
# failure from failing the caller. Queued: two automations may send at 08:00 together.
script:
  dry_air_notice:
    alias: "Dry-air notice"
    description: "Send one dry-air notice with the live readings appended. Called by the dry-air automations."
    mode: queued
    fields:
      thread:
        description: "airing or dehumidifier: the persistent notification id is asyla_dry_air_<thread>"
        required: true
        example: airing
        selector:
          text:
      title:
        description: "Notice title"
        required: true
        selector:
          text:
      message:
        description: "What to do and why; the readings are appended"
        required: true
        selector:
          text:
    sequence:
      - variables:
          readings: |-
            {%- macro t(e) -%}
            {%- set v = states(e) | float(none) -%}
            {%- set u = state_attr(e, 'unit_of_measurement') -%}
            {%- set c = none if v is none else (v - 32) * 5 / 9 if u == '°F' else v if u == '°C' else none -%}
            {{- 'unavailable' if c is none else '%.1f °F (%.1f °C)' | format(c * 9 / 5 + 32, c) -}}
            {%- endmacro -%}
            {%- macro h(e) -%}
            {%- set v = states(e) | float(none) -%}
            {{- 'RH unavailable' if v is none else '%.0f%% RH' | format(v) -}}
            {%- endmacro -%}
            Outdoors {{ t('sensor.mke_temperature') }}, {{ h('sensor.mke_humidity') }}, dew point {{ t('sensor.mke_dew_point') }}.
            Indoors {{ t('sensor.downstairs_hallway_temperature') }}, {{ h('sensor.downstairs_hallway_humidity') }}, dew point {{ t('sensor.indoor_dew_point') }}.
            Outdoor air warmed to the indoor temperature: {{ h('sensor.outdoor_air_rh_indoors') }}.
      - action: persistent_notification.create
        data:
          notification_id: "asyla_dry_air_{{ thread }}"
          title: "{{ title }}"
          message: |-
            {{ message }}

            {{ readings }}
      - action: notify.send_message
        continue_on_error: true
        target:
          entity_id: notify.hvac_report
        data:
          title: "{{ title }}"
          message: |-
            {{ message }}

            {{ readings }}

# Each automation: its state edges and 08:00 as triggers, 08:00-21:00 local as a condition (Sleep is
# 22:00-08:00), its gate on the helpers, then it sets its helper before it sends, so a failed send
# does not repeat. single + silent: a second trigger in the same instant is dropped, not queued
# past the gate. Run actions from the UI sends one now (that skips the conditions).
automation:
  - id: asyla_dry_air_air_the_house
    alias: "Dry air: air the house"
    description: >-
      Indoor RH 55% or more and the outdoor air can dry the house: open windows for 10-15 minutes.
      At most every 3 hours; 3 hours after a notice it checks again.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.outdoor_air_can_dry_the_house
        to: "on"
      - trigger: template
        value_template: "{{ states('sensor.downstairs_hallway_humidity') | float(0) >= 55 }}"
      - trigger: time
        at: "08:00:00"
      - trigger: time
        at:
          entity_id: input_datetime.dry_air_last_air_notice
          offset: "03:00:00"
    conditions:
      - condition: time
        after: "08:00:00"
        before: "21:00:00"
      - condition: state
        entity_id: binary_sensor.outdoor_air_can_dry_the_house
        state: "on"
      - condition: template
        value_template: "{{ states('sensor.downstairs_hallway_humidity') | float(0) >= 55 }}"
      # 3 hours since the last one, less a minute for the +3 h trigger's own timing.
      - condition: template
        value_template: >-
          {{ now().timestamp() - (state_attr('input_datetime.dry_air_last_air_notice', 'timestamp') or 0) >= 3 * 3600 - 60 }}
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dry_air_last_air_notice
        data:
          timestamp: "{{ now().timestamp() | int }}"
      - action: script.dry_air_notice
        data:
          thread: airing
          title: "Air the house"
          message: >-
            The outdoor air can dry the house. Open windows wide with a cross draft for 10-15
            minutes, then close them; repeat every 2-3 hours while it lasts. The next check is in
            3 hours.

  - id: asyla_dry_air_stop_airing
    alias: "Dry air: stop airing"
    description: >-
      Within 3 hours of an air-the-house notice, the outdoor air stops drying the house: close the
      windows, and why (humid, rain, too cold, warmer outside). Once per air notice.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.outdoor_air_can_dry_the_house
        from: "on"
        to: "off"
      - trigger: time
        at: "08:00:00"
    conditions:
      - condition: time
        after: "08:00:00"
        before: "21:00:00"
      - condition: state
        entity_id: binary_sensor.outdoor_air_can_dry_the_house
        state: "off"
      - condition: template
        value_template: >-
          {%- set a = state_attr('input_datetime.dry_air_last_air_notice', 'timestamp') or 0 -%}
          {%- set s = state_attr('input_datetime.dry_air_last_stop_notice', 'timestamp') or 0 -%}
          {{ now().timestamp() - a < 3 * 3600 and s < a }}
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dry_air_last_stop_notice
        data:
          timestamp: "{{ now().timestamp() | int }}"
      - action: script.dry_air_notice
        data:
          thread: airing
          title: "Stop airing"
          message: >-
            Close the windows: the outdoor air no longer dries the house
            ({{ state_attr('binary_sensor.outdoor_air_can_dry_the_house', 'reasons') or 'reason unknown' }}).

  - id: asyla_dry_air_dehumidifier_on
    alias: "Dry air: dehumidifier on"
    description: >-
      Indoor RH 60% or more for 6 hours while the outdoor air cannot dry the house: run the
      basement dehumidifier at 50%. Once until a dehumidifier-off notice.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.indoor_humidity_high
        to: "on"
      - trigger: state
        entity_id: binary_sensor.outdoor_air_can_dry_the_house
        to: "off"
      - trigger: time
        at: "08:00:00"
    conditions:
      - condition: time
        after: "08:00:00"
        before: "21:00:00"
      - condition: state
        entity_id: binary_sensor.indoor_humidity_high
        state: "on"
      # Off or unavailable: without station readings the outdoor air is not counted on.
      - condition: template
        value_template: "{{ not is_state('binary_sensor.outdoor_air_can_dry_the_house', 'on') }}"
      - condition: template
        value_template: >-
          {{ (state_attr('input_datetime.dry_air_last_dehumidifier_on_notice', 'timestamp') or 0)
             <= (state_attr('input_datetime.dry_air_last_dehumidifier_off_notice', 'timestamp') or 0) }}
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dry_air_last_dehumidifier_on_notice
        data:
          timestamp: "{{ now().timestamp() | int }}"
      - action: script.dry_air_notice
        data:
          thread: dehumidifier
          title: "Run the basement dehumidifier"
          message: >-
            Turn the basement dehumidifier on, set to 50%: indoor RH has been 60% or more for 6
            hours and the outdoor air cannot dry the house
            ({{ state_attr('binary_sensor.outdoor_air_can_dry_the_house', 'reasons') or 'readings unavailable' }}).

  - id: asyla_dry_air_dehumidifier_off
    alias: "Dry air: dehumidifier off"
    description: >-
      After a dehumidifier-on notice, indoor RH 50% or less for 3 hours: turn the basement
      dehumidifier off.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.indoor_humidity_dry_enough
        to: "on"
      - trigger: time
        at: "08:00:00"
    conditions:
      - condition: time
        after: "08:00:00"
        before: "21:00:00"
      - condition: state
        entity_id: binary_sensor.indoor_humidity_dry_enough
        state: "on"
      - condition: template
        value_template: >-
          {{ (state_attr('input_datetime.dry_air_last_dehumidifier_on_notice', 'timestamp') or 0)
             > (state_attr('input_datetime.dry_air_last_dehumidifier_off_notice', 'timestamp') or 0) }}
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dry_air_last_dehumidifier_off_notice
        data:
          timestamp: "{{ now().timestamp() | int }}"
      - action: script.dry_air_notice
        data:
          thread: dehumidifier
          title: "Turn the dehumidifier off"
          message: >-
            Turn the basement dehumidifier off: indoor RH has been 50% or less for 3 hours.
