# Pi-hole DNS server on ns02. Run through pihole.sh (it sets DOCKER_*, LOCAL_TZ and
# PIHOLE_DHCP_ACTIVE): ~/scripts/ns02/apps/pihole/pihole.sh up
# Access: http://10.0.0.11/admin
#
# Settings are pinned here as FTLCONF_ lines, not clicked in the web UI: a setting given by
# FTLCONF_ is read-only in the UI and the API, so the two name servers cannot drift apart again.
# ns01's copy differs only in its name and DHCP. Data that is not a setting (CNAMEs written by the
# asyla/pihole pipeline, domain lists, gravity) lives in etc-pihole/ and travels in the backup.

services:
  pihole:
    # 2026.05.0 is what ns02 runs today (digest 70a9c111..., pulled 2026-05-11). The apps rota moves it.
    image: pihole/pihole:2026.05.0@sha256:70a9c11171ded2eee735d88c127996da209284a329d50f5ae59c06b861d401b3
    container_name: pihole-ns02
    hostname: ns02.asyla.org
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${LOCAL_TZ:-America/Chicago}
      - PIHOLE_UID=${DOCKER_UID:-1003}
      - PIHOLE_GID=${DOCKER_GID:-1000}
      # No FTLCONF_webserver_api_password here: set that way, Pi-hole makes the password read-only and
      # an empty value removes it at every start. `pihole.sh password` sets it once (compose.admin-login.yml);
      # Pi-hole then keeps only the hash in etc-pihole/pihole.toml, which restarts and the restore keep.
      # DHCP guard: off unless pihole.sh says this host is ns01, so no copy of this app (a test01
      # replica, a wrong host, a plain `docker compose up`) can ever be a second DHCP server.
      - FTLCONF_dhcp_active=${PIHOLE_DHCP_ACTIVE:-false}
      - FTLCONF_dns_listeningMode=all
      - FTLCONF_dns_dnssec=true
      - FTLCONF_dns_domain_name=ns02.asyla.org
      - FTLCONF_dns_upstreams=1.1.1.1;1.0.0.1
      # One set for both servers (operator, 2026-10-18): bare hostnames resolve (the local domain is
      # added to hosts-file names), and neither bare names nor reverse lookups of private addresses
      # are sent upstream. Before this, ns01 and ns02 each had a different mix.
      - FTLCONF_dns_expandHosts=true
      - FTLCONF_dns_domainNeeded=true
      - FTLCONF_dns_bogusPriv=true
      # ns01's one local record, kept on both (operator, 2026-10-19): wpad answers 255.255.255.255, so
      # no client auto-discovers a web proxy (WPAD hijack). Every other local name is the NAS hosts file.
      - FTLCONF_dns_hosts=255.255.255.255 wpad
      - FTLCONF_misc_etc_dnsmasq_d=true
      - FTLCONF_database_busytimeout=60000
      # IPv4 upstreams only: the hosts have no IPv6 (IPv6 upstreams log "Network unreachable").
    volumes:
      - ${DOCKER_DL:-/mnt/docker}/pihole-ns02/etc-pihole:/etc/pihole
      - ${DOCKER_DL:-/mnt/docker}/pihole-ns02/etc-dnsmasq.d:/etc/dnsmasq.d
      # On the NAS by design (central, snapshotted, reachable when all else is down; never in a
      # repo). pihole.sh up refuses to start when it is missing: Docker would make a directory here.
      - ${DOCKER_D2:-/mnt/nas/data2/docker}/pihole/hosts:/etc/hosts:ro
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    stop_grace_period: 45s
    # Host network: DNS 53/tcp+udp, DHCP 67/udp (ns01 only), web 80/tcp, 443/tcp.
