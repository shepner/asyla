# Gitea Actions runner on d01-d03. Run with: ~/scripts/<host>/apps/gitea-runner/gitea-runner.sh up
# gitea-runner.sh exports RUNNER_IMAGE, RUNNER_LABELS, DATA_DIR and LOCAL_TZ; see README.md.
# The registration token is never in here: `gitea-runner.sh register` writes /data/.runner first, so
# the image's entrypoint skips registering and starts the daemon.

services:
  gitea-runner:
    image: ${RUNNER_IMAGE}
    container_name: gitea-runner
    restart: unless-stopped
    environment:
      - CONFIG_FILE=/data/config.yaml
      # The entrypoint passes these to the daemon too, so a label change applies on restart.
      - GITEA_RUNNER_LABELS=${RUNNER_LABELS}
      # Without /data/.runner the entrypoint would retry registering forever; fail once instead.
      - GITEA_MAX_REG_ATTEMPTS=1
      - TZ=${LOCAL_TZ}
    volumes:
      - ${DATA_DIR}:/data
      # The runner starts job containers on the host daemon. Jobs themselves do not get the
      # socket (config.yaml: container.docker_host "-").
      - /var/run/docker.sock:/var/run/docker.sock
    # Longer than runner.shutdown_timeout, so running jobs can finish on stop.
    stop_grace_period: 11m
