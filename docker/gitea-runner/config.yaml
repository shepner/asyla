# gitea-runner config for d01-d03 (native, host mode). Every key not set here keeps the default of
# `gitea-runner config generate` (v4.1.0). Labels are not set here: they are given at registration
# (gitea-runner.sh register) and kept in .runner.

runner:
  file: .runner
  # Same as the Mini: a low capacity left chains of small jobs queued for hours. Jobs that must not
  # overlap say so themselves: a workflow `concurrency` group (Gitea >= 1.26) or the app scripts' locks.
  capacity: 10
  timeout: 3h
  # Let a running job finish when the service stops (gitea-runner.service TimeoutStopSec is 11min).
  shutdown_timeout: 10m
