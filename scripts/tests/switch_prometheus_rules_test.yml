# promtool unit test of d03/apps/switch-monitor/prometheus-rules.yml (README.md there, "Tests"):
#   docker run --rm -v "$PWD:/r:ro" -w /r --entrypoint promtool prom/prometheus:v2.48.1 test rules scripts/tests/switch_prometheus_rules_test.yml
# Series in the label shapes of snmp_exporter v0.30.1's stock modules, as theOrg's job would label them.
rule_files:
  - ../../d03/apps/switch-monitor/prometheus-rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'ifOperStatus{job="asyla-switch-snmp",switch="switch1",instance="192.168.88.1",ifIndex="9",ifName="sfp-sfpplus9",ifAlias="nas01"}'
        values: '2x20'
      - series: 'ifAdminStatus{job="asyla-switch-snmp",switch="switch1",instance="192.168.88.1",ifIndex="9",ifName="sfp-sfpplus9",ifAlias="nas01"}'
        values: '1x20'
      - series: 'ifOperStatus{job="asyla-switch-snmp",switch="switch1",instance="192.168.88.1",ifIndex="2",ifName="ether2",ifAlias=""}'
        values: '2x20'
      - series: 'ifAdminStatus{job="asyla-switch-snmp",switch="switch1",instance="192.168.88.1",ifIndex="2",ifName="ether2",ifAlias=""}'
        values: '1x20'
      - series: 'mtxrGaugeValue{job="asyla-switch-snmp",switch="switch1",instance="192.168.88.1",mtxrGaugeName="psu2-state"}'
        values: '1x20'
      - series: 'mtxrGaugeUnit{job="asyla-switch-snmp",switch="switch1",instance="192.168.88.1",mtxrGaugeName="psu2-state"}'
        values: '6x20'
      - series: 'mtxrGaugeValue{job="asyla-switch-snmp",switch="switch1",instance="192.168.88.1",mtxrGaugeName="switch-temperature"}'
        values: '49x20'
      - series: 'mtxrGaugeUnit{job="asyla-switch-snmp",switch="switch1",instance="192.168.88.1",mtxrGaugeName="switch-temperature"}'
        values: '1x20'
      - series: 'ifInErrors{job="asyla-switch-snmp",switch="switch1",instance="192.168.88.1",ifIndex="2",ifName="ether2",ifAlias=""}'
        values: '0+1x60'
      - series: 'ifOutErrors{job="asyla-switch-snmp",switch="switch1",instance="192.168.88.1",ifIndex="2",ifName="ether2",ifAlias=""}'
        values: '0x60'
      - series: 'mtxrFirmwareVersion{job="asyla-switch-snmp",switch="switch1",instance="192.168.88.1",mtxrFirmwareVersion="7.21.4"}'
        values: '1x20'
      - series: 'mtxrFirmwareUpgradeVersion{job="asyla-switch-snmp",switch="switch1",instance="192.168.88.1",mtxrFirmwareUpgradeVersion="7.23.8"}'
        values: '1x20'
      - series: 'wlsxPseSlotPowerAvailable{job="asyla-switch-snmp",switch="switch2",instance="10.0.0.41",wlsxPseSlotIndex="0"}'
        values: '400x20'
      - series: 'wlsxPseSlotPowerConsumption{job="asyla-switch-snmp",switch="switch2",instance="10.0.0.41",wlsxPseSlotIndex="0"}'
        values: '330x20'
      - series: 'ifOperStatus{job="asyla-switch-snmp",switch="switch2",instance="10.0.0.41",ifIndex="129",ifName="gigabitethernet0/1/0",ifAlias="uplink"}'
        values: '2x20'
      - series: 'ifAdminStatus{job="asyla-switch-snmp",switch="switch2",instance="10.0.0.41",ifIndex="129",ifName="gigabitethernet0/1/0",ifAlias="uplink"}'
        values: '1x20'
      - series: 'ifLastChange{job="asyla-switch-snmp",switch="switch2",instance="10.0.0.41",ifIndex="129",ifName="gigabitethernet0/1/0",ifAlias="uplink"}'
        values: '100x10 999x10'
      - series: 'sysExtFanStatus{job="asyla-switch-snmp",switch="switch2",instance="10.0.0.41",sysExtFanIndex="1"}'
        values: '2x20'
      - series: 'sysExtPowerSupplyStatus{job="asyla-switch-snmp",switch="switch2",instance="10.0.0.41",sysExtPowerSupplyIndex="0"}'
        values: '1x20'
      - series: 'wlsxSysExtInternalTemparature{job="asyla-switch-snmp",switch="switch2",instance="10.0.0.41"}'
        values: '66x20'
      - series: 'wlsxPsePortStatus{job="asyla-switch-snmp",switch="switch2",instance="10.0.0.41",wlsxPsePortIndex="5"}'
        values: '6x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: SwitchWatchedPortDown
        exp_alerts:
          - exp_labels: {severity: critical, job: asyla-switch-snmp, switch: switch1, instance: 192.168.88.1,
                         ifIndex: "9", ifName: sfp-sfpplus9, ifAlias: nas01}
            exp_annotations: {summary: "switch1: port sfp-sfpplus9 (nas01) is down"}
          - exp_labels: {severity: critical, job: asyla-switch-snmp, switch: switch2, instance: 10.0.0.41,
                         ifIndex: "129", ifName: gigabitethernet0/1/0, ifAlias: uplink}
            exp_annotations: {summary: "switch2: port gigabitethernet0/1/0 (uplink) is down"}
      - eval_time: 15m
        alertname: SwitchWatchedPortChangedState
        exp_alerts:
          - exp_labels: {severity: warning, job: asyla-switch-snmp, switch: switch2, instance: 10.0.0.41,
                         ifIndex: "129", ifName: gigabitethernet0/1/0, ifAlias: uplink}
            exp_annotations: {summary: "switch2: port gigabitethernet0/1/0 changed state in the last hour"}
      - eval_time: 15m
        alertname: SwitchFanInactive
        exp_alerts:
          - exp_labels: {severity: critical, job: asyla-switch-snmp, switch: switch2, instance: 10.0.0.41,
                         sysExtFanIndex: "1"}
            exp_annotations: {summary: "switch2: fan 1 is not active (value 2)"}
      - eval_time: 15m
        alertname: SwitchPsuInactive
        exp_alerts: []
      - eval_time: 15m
        alertname: SwitchArubaTemperatureHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: asyla-switch-snmp, switch: switch2, instance: 10.0.0.41}
            exp_annotations: {summary: "switch2: temperature 66 C (over 65 C)"}
      - eval_time: 15m
        alertname: SwitchArubaTemperatureCritical
        exp_alerts: []
      - eval_time: 15m
        alertname: SwitchPoePortHardwareError
        exp_alerts:
          - exp_labels: {severity: warning, job: asyla-switch-snmp, switch: switch2, instance: 10.0.0.41,
                         wlsxPsePortIndex: "5"}
            exp_annotations: {summary: "switch2: PoE port (ifIndex 5) gives no power: hardware error"}
      - eval_time: 15m
        alertname: SwitchHealthStateNotOk
        exp_alerts:
          - exp_labels: {severity: critical, job: asyla-switch-snmp, switch: switch1, instance: 192.168.88.1,
                         mtxrGaugeName: psu2-state}
            exp_annotations: {summary: "switch1: psu2-state is not ok (value 1)"}
      - eval_time: 15m
        alertname: SwitchTemperatureHigh
        exp_alerts: []
      - eval_time: 60m
        alertname: SwitchPortErrors
        exp_alerts:
          - exp_labels: {severity: warning, job: asyla-switch-snmp, switch: switch1, instance: 192.168.88.1,
                         ifIndex: "2", ifName: ether2}   # an empty ifAlias is no label
            exp_annotations: {summary: "switch1: port ether2: 60 errors in an hour (over 10)"}
      - eval_time: 15m
        alertname: SwitchRouterboardFirmwareBehind
        exp_alerts:
          - exp_labels: {severity: warning, job: asyla-switch-snmp, switch: switch1, instance: 192.168.88.1,
                         mtxrFirmwareVersion: "7.21.4"}
            exp_annotations: {summary: "switch1: routerboard firmware differs from the one installed with RouterOS"}
      - eval_time: 15m
        alertname: SwitchPoeBudgetHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: asyla-switch-snmp, switch: switch2, instance: 10.0.0.41,
                         wlsxPseSlotIndex: "0"}
            exp_annotations: {summary: "switch2: PoE draws over 80 % of slot 0's budget"}
