#cloud-config
# Vendor data for every d0N host built by scripts/build_host.py (uploaded as
# local:snippets/<host>-vendor.yml). Proxmox's own cloud-init settings add the user `docker`
# (ciuser, passwordless sudo), its SSH key, the address and DNS.
#
# Deliberately minimal: no secrets and nothing fetched from the repo. Everything after first boot
# (deploy token, host scripts, data disk, setup, secrets, apps, runner) is done by build_host.py
# over SSH, so a failed step is visible and re-runnable from the workstation.

package_update: true
packages: [git, curl, rsync, parted, qemu-guest-agent]

# IDs as on d01/d02: docker UID 1003, primary group asyla (GID 1001), member of docker (GID 1000,
# the group NAS files carry). Created in bootcmd, which runs before cloud-init's users_groups
# module, so Proxmox's ciuser finds docker already there and only adds its key and sudo rule.
# (Renumbering in runcmd fails: by then build_host.py's SSH wait is logged in as docker, and
# usermod refuses a user with running processes, as on d04 2026-10-09.)
bootcmd:
  - [sh, -c, "getent group docker >/dev/null || groupadd -g 1000 docker; getent group asyla >/dev/null || groupadd -g 1001 asyla; id docker >/dev/null 2>&1 || useradd -m -u 1003 -g asyla -G docker,sudo -s /bin/bash docker"]

runcmd:
  - systemctl enable --now qemu-guest-agent ssh
  - [sh, -c, "test \"$(id -u docker)\" = 1003 && test \"$(id -gn docker)\" = asyla && id -nG docker | grep -qw docker && touch /var/lib/cloud/instance/asyla-vendor-done"]
