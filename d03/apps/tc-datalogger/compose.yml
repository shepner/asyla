# tc-datalogger on d03 — data under /mnt/docker/tc-datalogger
# Dashboard: host :8081 (breeding-research uses :8080). Pipelines: Gitea images or local build.
# Store: tc-doltgres (Doltgres, database torn_data), not published; data in doltgres/, its
# verified Dolt backup in doltgres-backup/ (tc-datalogger.sh backup). The password is
# tc_db_password.secret beside this file (host.toml [[secret]] D03_TC_DATALOGGER_DB_PASSWORD),
# /run/secrets/tc_db_password in every container. Cutover: tc-datalogger docs/d03-cutover.md.
# Run: ~/scripts/d03/apps/tc-datalogger/tc-datalogger.sh up

# Container output: the `local` driver, which rotates (json-file, the daemon default on d03, never
# does; build/setup/docker.sh). tc-doltgres wrote 4.7 MB in its first 36 h on d03 (2026-10-27).
x-logging: &logging
  driver: local
  options: {max-size: "20m", max-file: "5", compress: "true"}

networks:
  tc_datalogger_net:
    name: tc_datalogger_net
    driver: bridge

services:
  tc-doltgres:
    image: dolthub/doltgresql:1.3.3
    container_name: tc-doltgres
    logging: *logging
    restart: unless-stopped
    # The image takes DOLTGRES_PASSWORD only when it initialises an empty data dir; an empty or
    # missing secret refuses to start rather than initialise without the provisioned password.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        DOLTGRES_PASSWORD="$$(cat /run/secrets/tc_db_password 2>/dev/null)";
        [ -n "$$DOLTGRES_PASSWORD" ] || { echo "no password in /run/secrets/tc_db_password; refusing to start" >&2; exit 1; };
        export DOLTGRES_PASSWORD;
        exec tini -v -- docker-entrypoint.sh
    environment:
      - TZ=UTC
      - DOLTGRES_USER=postgres
    secrets:
      - tc_db_password
    volumes:
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/doltgres:/var/lib/doltgres
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/doltgres-backup:/backups
    networks:
      - tc_datalogger_net
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$$(cat /run/secrets/tc_db_password)" psql -h 127.0.0.1 -U postgres -d postgres -tAc 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s

  tc-faction-crimes:
    image: ${TC_REGISTRY:-gitea.asyla.org/personal}/tc-datalogger-faction-crimes:${TC_IMAGE_TAG}
    container_name: tc-faction-crimes-pipeline
    logging: *logging
    restart: unless-stopped
    # Healthcheck: asyla backlog 2026-10-20-hosts-observability-through-theorg (operator, 2026-10-20).
    # A pipeline serves nothing: healthy while its cron log was written in the last 45 min (it
    # runs every 15 min; tc-faction-chains hourly, so 3 h). The image has python only.
    healthcheck:
      test: ["CMD", "python", "-c", 'import os, sys, time; sys.exit(time.time() - os.path.getmtime("/app/logs/cron.log") > 2700)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      tc-doltgres:
        condition: service_healthy
    secrets:
      - tc_db_password
    environment:
      - TZ=${LOCAL_TZ:-America/Chicago}
      - TC_DB_HOST=tc-doltgres
      - TC_DB_PORT=5432
      - TC_DB_NAME=torn_data
    networks:
      - tc_datalogger_net
    volumes:
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_faction_crimes/config/TC_API_config.json:/app/config/TC_API_config.json:ro
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_faction_crimes/config/oc_records_schema.json:/app/config/oc_records_schema.json:ro
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_faction_crimes/logs:/app/logs

  tc-faction-members:
    image: ${TC_REGISTRY:-gitea.asyla.org/personal}/tc-datalogger-faction-members:${TC_IMAGE_TAG}
    container_name: tc-faction-members-pipeline
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", 'import os, sys, time; sys.exit(time.time() - os.path.getmtime("/app/logs/cron.log") > 2700)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      tc-doltgres:
        condition: service_healthy
    secrets:
      - tc_db_password
    environment:
      - TZ=${LOCAL_TZ:-America/Chicago}
      - TC_DB_HOST=tc-doltgres
      - TC_DB_PORT=5432
      - TC_DB_NAME=torn_data
    volumes:
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_faction_members/config/TC_API_config.json:/app/config/TC_API_config.json:ro
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_faction_members/logs:/app/logs
    networks:
      - tc_datalogger_net

  tc-items:
    image: ${TC_REGISTRY:-gitea.asyla.org/personal}/tc-datalogger-items:${TC_IMAGE_TAG}
    container_name: tc-items-pipeline
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", 'import os, sys, time; sys.exit(time.time() - os.path.getmtime("/app/logs/cron.log") > 2700)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      tc-doltgres:
        condition: service_healthy
    secrets:
      - tc_db_password
    environment:
      - TZ=${LOCAL_TZ:-America/Chicago}
      - TC_DB_HOST=tc-doltgres
      - TC_DB_PORT=5432
      - TC_DB_NAME=torn_data
    volumes:
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_items/config/TC_API_config.json:/app/config/TC_API_config.json:ro
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_items/logs:/app/logs
    networks:
      - tc_datalogger_net

  tc-user-events:
    image: ${TC_REGISTRY:-gitea.asyla.org/personal}/tc-datalogger-user-events:${TC_IMAGE_TAG}
    container_name: tc-user-events-pipeline
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", 'import os, sys, time; sys.exit(time.time() - os.path.getmtime("/app/logs/cron.log") > 2700)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      tc-doltgres:
        condition: service_healthy
    secrets:
      - tc_db_password
    environment:
      - TZ=${LOCAL_TZ:-America/Chicago}
      - TC_DB_HOST=tc-doltgres
      - TC_DB_PORT=5432
      - TC_DB_NAME=torn_data
      # The FFScouter key for the Event Targets step (targets.ffscouter_api_key = "ffscouter"). It is
      # in no file: build_host.py start_env hands it to tc-datalogger.sh up; the empty default lets
      # a start without it run (the step then skips FFScouter and says so).
      - TC_API_KEY_FFSCOUTER=${TC_API_KEY_FFSCOUTER:-}
    volumes:
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_user_events/config/TC_API_config.json:/app/config/TC_API_config.json:ro
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_user_events/logs:/app/logs
    networks:
      - tc_datalogger_net

  tc-faction-chains:
    image: ${TC_REGISTRY:-gitea.asyla.org/personal}/tc-datalogger-faction-chains:${TC_IMAGE_TAG}
    container_name: tc-faction-chains-pipeline
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", 'import os, sys, time; sys.exit(time.time() - os.path.getmtime("/app/logs/cron.log") > 10800)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      tc-doltgres:
        condition: service_healthy
    secrets:
      - tc_db_password
    environment:
      - TZ=${LOCAL_TZ:-America/Chicago}
      - TC_DB_HOST=tc-doltgres
      - TC_DB_PORT=5432
      - TC_DB_NAME=torn_data
    volumes:
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_faction_chains/config/TC_API_config.json:/app/config/TC_API_config.json:ro
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_faction_chains/logs:/app/logs
    networks:
      - tc_datalogger_net

  # The pipelines append to cron.log on the data disk and never rotate it (254M for faction_chains on
  # 2026-10-20). rotate-logs.sh cuts each above 20 MiB in place, keeping the last 1 MiB and one
  # whole previous copy as cron.log.1.gz, and keeps the mtime the healthchecks above read (asyla
  # backlog 2026-10-20-asyla-hosts-tc-datalogger-log-rotation-and-heartbeat). It runs as the files'
  # owner (common.env) with no network. Healthy while a pass succeeded in the last 130 min.
  tc-log-rotate:
    image: busybox:1.37
    container_name: tc-log-rotate
    restart: unless-stopped
    user: "${DOCKER_UID:-1003}:${DOCKER_GID:-1000}"
    network_mode: none
    command:
      - sh
      - /rotate-logs.sh
      - /logs/faction_crimes/cron.log
      - /logs/faction_members/cron.log
      - /logs/items/cron.log
      - /logs/user_events/cron.log
      - /logs/faction_chains/cron.log
    healthcheck:
      test: ["CMD-SHELL", "[ -n \"$$(find /tmp/rotate-pass -mmin -130 2>/dev/null)\" ]"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: local
      options: {max-size: "1m", max-file: "3"}
    volumes:
      - ./rotate-logs.sh:/rotate-logs.sh:ro
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_faction_crimes/logs:/logs/faction_crimes
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_faction_members/logs:/logs/faction_members
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_items/logs:/logs/items
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_user_events/logs:/logs/user_events
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_faction_chains/logs:/logs/faction_chains

  tc-dashboard:
    image: ${TC_REGISTRY:-gitea.asyla.org/personal}/tc-datalogger-dashboard:${TC_IMAGE_TAG}
    container_name: tc-dashboard
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=4)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    secrets:
      - tc_db_password
    environment:
      - TZ=${LOCAL_TZ:-America/Chicago}
      - TC_DB_HOST=tc-doltgres
      - TC_DB_PORT=5432
      - TC_DB_NAME=torn_data
      - DASHBOARD_PORT=8080
      - DASHBOARD_BASE_PATH=/app/data
      - DASHBOARD_SECRET_KEY=${DASHBOARD_SECRET_KEY:-}
      - DASHBOARD_MODE=${DASHBOARD_MODE:-production}
    ports:
      - "8081:8080"
    volumes:
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_faction_crimes/logs:/app/logs/faction_crimes:ro
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_faction_members/logs:/app/logs/faction_members:ro
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_items/logs:/app/logs/items:ro
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_user_events/logs:/app/logs/user_events:ro
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_faction_chains/logs:/app/logs/faction_chains:ro
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/TC_dashboard/logs:/app/logs
      - ${DOCKER_DL:-/mnt/docker}/tc-datalogger/repo/TC_dashboard:/app/data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - tc_datalogger_net

secrets:
  tc_db_password:
    file: ./tc_db_password.secret
