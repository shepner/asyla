# Cloudflare Tunnel — d03

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${CLOUDFLARED_CONTAINER_NAME:-cloudflared-d03}
    restart: unless-stopped
    command: ["tunnel", "run", "--token", "${TUNNEL_TOKEN}"]
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    extra_hosts:
      # Remote tunnel config still targets k8s internal-proxy hostname; resolve to host :80 (d03 Caddy).
      - "internal-proxy.asyla-edge.svc.cluster.local:host-gateway"
    networks:
      - tc_datalogger_net
      - gitea_net
      - plane_net
      - openbao_net
      - uptimekuma_net
      - vikunja_net
      - cq_net
      - agent_commons_net
      - breeding_research_net

networks:
  tc_datalogger_net:
    external: true
    name: tc_datalogger_net
  gitea_net:
    external: true
    name: gitea_net
  plane_net:
    external: true
    name: plane_net
  openbao_net:
    external: true
    name: openbao_net
  uptimekuma_net:
    external: true
    name: uptimekuma_net
  vikunja_net:
    external: true
    name: vikunja_net
  cq_net:
    external: true
    name: cq_net
  agent_commons_net:
    external: true
    name: agent_commons_net
  breeding_research_net:
    external: true
    name: breeding_research_net
