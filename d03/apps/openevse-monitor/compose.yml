# openevse-monitor on d03 (README.md): openevse_check.py every OPENEVSE_INTERVAL seconds, a fresh
# process each time. The login is in no file: openevse-monitor.sh up refuses to start without it in
# its environment (build_host.py start_env); the empty defaults let down, logs and verify run without it.
name: openevse-monitor

services:
  openevse-monitor:
    image: python:3.12-alpine
    container_name: openevse-monitor
    restart: unless-stopped
    user: "${OPENEVSE_UID:?}:${OPENEVSE_GID:?}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      OPENEVSE_WWW_USER: ${OPENEVSE_WWW_USER:-}
      OPENEVSE_WWW_PASSWORD: ${OPENEVSE_WWW_PASSWORD:-}
      OPENEVSE_DATA: /data
      OPENEVSE_INTERVAL: "300"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
    command: ["sh", "-c", "while :; do python3 /app/openevse_check.py; sleep \"$$OPENEVSE_INTERVAL\"; done"]
    volumes:
      # The app directory, not single files: the nightly scripts task replaces files, and a file
      # mount would keep the old one.
      - ./:/app:ro
      - ${OPENEVSE_ROOT:?}:/data
      # Zone data for local times in messages (the alpine image has none).
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      # status.json rewritten within two cycles and a bit (a cycle can take 2 minutes on retries).
      test: ["CMD", "python3", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/data/status.json') > 900)"]
      interval: 60s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging:
      driver: local
      options: {max-size: "5m", max-file: "3"}
