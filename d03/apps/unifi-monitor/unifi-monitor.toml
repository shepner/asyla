# What unifi_check.py watches and when it calls something a problem (README.md beside this file).

# An urgent finding (console not connected, device not online) must be seen on this many checks in a
# row (5 minutes apart) before status.json carries it; the host-maintenance monitor mails at once.
confirm_cycles = 2
# A device whose startupTime is this recent is reported as restarted (digest). The consoles
# auto-update daily at 03:00 local (v1/hosts autoUpdate, 2026-10-22), so a restart then is planned.
reboot_report_hours = 24
# A firmware update waiting this long is reported (digest).
firmware_waiting_days = 7
# The Site Manager key (asyla organization) was made 2026-10-21 for a year; warned 30 days before.
key_expires = "2027-10-21"

# Each console by its Site Manager name. wan = true: it has a UniFi gateway, so ISP metrics exist.
[consoles.DAY]
wan = true    # the parents' site: UXG Lite behind Metronet
[consoles.MKE]
wan = false   # home: the gateway is fw01, not UniFi

# DAY's 5-minute ISP metrics over 24 h to 2026-10-22T18:55Z (258 periods): avgLatency 12-14 ms,
# maxLatency 12-16 ms, packetLoss 0-6 (0 in 158), downtime 0. A warning needs `periods` of the
# hour's periods past a limit, so one bad 5 minutes is not reported.
[wan]
window_minutes = 60
latency_ms = 30
loss = 10
periods = 3
stale_hours = 3   # the newest period was about an hour old when read (2026-10-22T20:01Z)
