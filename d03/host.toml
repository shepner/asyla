# d03 build spec, read by scripts/build_host.py (asyla hub decisions/host-build-and-recovery.md).
# The rebuilt d03 (asyla hub decisions/host-layout.md, Consequences step 6): a new, smaller VM with
# its own data disk. [vm] is the operator's accepted layout of 2026-10-13 (host-layout.md "Sizes"),
# not `qm config 103`. Gitea is not here: it runs on d04 since the 2026-10-16 cutover. VM 103 (the
# old d03) is kept, stopped, as the way back, so this spec must never name VMID 103.
# order=15: after d04 (order=10) when vmh01 boots.
[vm]
node = "vmh01"
vmid = 113                 # operator, 2026-10-17; never 103 (VM 103 is kept stopped as the way back)
sockets = 1
cores = 6                  # operator: as the old d03
memory_mb = 8192
ip = "10.0.0.62/24"
os_disk = { storage = "local-data2", size = "32G" }
data_disk = { storage = "local-data2", size = "32G" }   # /mnt/docker
cloudinit_storage = "local-data2"
startup = "order=15"       # set at create, checked by verify

# build/setup/, as d04 and test01: d03 left build_host.py's LEGACY_HOSTS and has no setup/ of its own.
[setup]
steps = ["systemConfig.sh", "nfs.sh", "docker.sh", "bashrc.sh"]   # no SMB media mount on d03 (live, 2026-10-07)

[[secret]]
var = "D03_BREEDING_RESEARCH_ENV"
path = "/home/docker/scripts/d03/apps/breeding-research/.env"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_TC_DATALOGGER_ENV"
path = "/home/docker/scripts/d03/apps/tc-datalogger/.env"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_BREEDING_RESEARCH_GCP_CREDENTIALS_JSON"
path = "/mnt/docker/breeding-research/gcp-credentials.json"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_CLOUDFLARED_ENV"
path = "/mnt/docker/cloudflared/.env"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_INTERNAL_PROXY_ENV"
path = "/mnt/docker/internal-proxy/.env"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_MS_PROCEDURAL_BACKUP_ENV"     # backup-only token; also re-deliverable by memory-system deliver-backup-token.sh
path = "/home/docker/scripts/d03/apps/ms-procedural-backup/.env"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_MS_CHRONICLE_BACKUP_ENV"      # backup-only token; also re-deliverable by memory-system ms-chronicle-mcp/scripts/deliver-backup-token.sh
path = "/home/docker/scripts/d03/apps/ms-chronicle-backup/.env"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_DOCKER_CONFIG_JSON"           # registry login for gitea.asyla.org images
path = "/home/docker/.docker/config.json"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_HOST_MAINTENANCE_SSH_KEY"     # host-maintenance jobs' key into d01-d04
path = "/home/docker/.config/host-maintenance/ssh/id_ed25519"
owner = "docker:docker"
mode = "600"

# host-maintenance's key set, the interim one (operator, 2026-10-17: the cutover does not wait for
# each host maintaining itself; asyla backlog 2026-10-17-hosts-host-maintenance-each-host-...): the
# jobs run on this host's runner (host-maintenance below, /maint-ssh) and `ssh docker@ADDRESS` by
# the addresses of asyla/host-maintenance config/maintenance.toml. Pins: d01, d02, d04's ed25519
# host keys (ssh-keyscan -t ed25519 from the workstation, 2026-10-17, equal to its known_hosts);
# the build scans each from here and fails on another key. d03 itself: its new host key, read on
# the host by the setup phase (self_address), as no spec can pin it before the build.
[host_maintenance]
identity = "/home/docker/.config/host-maintenance/ssh/id_ed25519"
user = "docker"
known_hosts = [
  "10.0.0.60 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDklyJ5JfOrunGhBVq3B00PFofICXisn2NryUP5yvA5D",
  "10.0.0.61 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK+LjU+hfw8ZMCCFIDeMIXfut12jX3Njl+MDDZ/RG5qq",
  "10.0.0.63 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMPnOQj7p8zI/CwT75iHiFw0ECXg6prI0ZKZ7WDshnLE",
  "10.0.0.65 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIbFmkQHw4NHbraGGnePcFfSB4AXKTXBaBRrTEVYpgM/",
]
self_address = "10.0.0.62"

# d04 first: the runner registers with Gitea on d04 (GITEA_TOKEN_HOST), and breeding-research and
# tc-datalogger pull their images from gitea.asyla.org on d04, so d04 must be up before d03 is
# built. (agent-commons retired 2026-10-08: ms-procedural on the Mini; archive in
# /mnt/nas/data1/docker/agent-commons/mirror.)
[[app]]
name = "breeding-research"
start = ["up"]   # pulls BREEDING_RESEARCH_IMAGE from Gitea's registry on d04 (.env: PULL=1; gap G7)
verify = ["verify"]
[[app]]
name = "tc-datalogger"
verify = ["verify"]
[[app]]
name = "ms-procedural-backup"   # no container: nightly pull of ms-procedural (Mini) into the NAS mirror
start = []
restore = false                 # its data is a copy of the Mini's; the next backup re-pulls it
verify = ["verify"]
[[app]]
name = "ms-chronicle-backup"    # no container: nightly pull of ms-chronicle's verified backup (Mini) into the NAS mirror
start = []
restore = false                 # its data is a copy of the Mini's; the next backup re-pulls it
verify = ["verify"]

[[external]]
name = "internal-access"
repo = "~/local/asyla/projects/internal-access"
run = ["scripts/deploy-host.sh {host}", "scripts/fleet.sh --host {host} restore up verify"]
[[external]]
name = "external-access"
repo = "~/local/asyla/projects/external-access"
run = ["scripts/deploy-host.sh {host}", "scripts/fleet.sh --host {host} up verify"]
[[external]]
name = "theorg-mini-deadman"
repo = "~/local/theOrg"
manual = ".cursor/helpers/runtime-watchdog/install-d03-deadman.sh (theOrg-owned; needs /etc/theorg-deadman/gitea.env)"
# verify runs this on d03: the installer's timer is active and its secret is in place.
check = "systemctl is-active --quiet theorg-mini-deadman.timer && sudo test -s /etc/theorg-deadman/gitea.env"

[runner]
enabled = true

# GitLab runners (build/gitlab-runner/gitlab-runner.sh, run by the build's runner phase), as the
# live d03 runs them (2026-10-17, read-only: GitLab API listed with type=group_type/project_type,
# `gitlab-runner list` and config.toml's non-secret keys on d03). GitLab descriptions become
# d03-group and d03-host-maintenance; the old entries "d03 group" (53360564) and
# "host-maintenance-d03" (56843179) are not matched by them and are deleted separately.
# Live, both are ref_protected; the build creates its runners ref_protected too (operator, 2026-10-17).
[[gitlab_runner.runners]]
name = "group"              # live "d03 group"; pihole's DNS pipeline needs tags d03 + homelab
scope = "group:asyla"
tags = ["d03", "homelab", "asyla-ci", "theorg-ci"]
executor = "docker"
image = "python:3.12-slim"
volumes = ["/var/run/docker.sock:/var/run/docker.sock"]   # live; "/cache" is added by register
pull_policy = "always"      # live config.toml sets none, so the docker executor's default, always;
                            # set explicitly (operator, 2026-10-17): the spec default is if-not-present

[[gitlab_runner.runners]]
name = "host-maintenance"   # live "host-maintenance-d03": the scheduled maintenance jobs
scope = "project:asyla/host-maintenance"
tags = ["host-maintenance"]
executor = "docker"
image = "python:3.12-alpine"
volumes = ["/home/docker/.config/host-maintenance/ssh:/maint-ssh:ro"]   # live; "/cache" is added by register
pull_policy = "if-not-present"
