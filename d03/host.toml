# d03 build spec, read by scripts/build_host.py (asyla hub decisions/host-build-and-recovery.md).
# The rebuilt d03 (asyla hub decisions/host-layout.md, Consequences step 6): a new, smaller VM with
# its own data disk. [vm] is the operator's accepted layout of 2026-10-13 (host-layout.md "Sizes"),
# not `qm config 103`. Gitea is not here: it runs on d04 since the 2026-10-16 cutover. VM 103 (the
# old d03) is kept, stopped, as the way back, so this spec must never name VMID 103.
# order=15: after d04 (order=10) when vmh01 boots.
[vm]
node = "vmh01"
vmid = 0                   # VMID: the operator's choice, set before merge; never 103 (VM 103 is kept stopped as the way back)
sockets = 1
cores = 6                  # operator: as the old d03
memory_mb = 8192
ip = "10.0.0.62/24"
os_disk = { storage = "local-data2", size = "32G" }
data_disk = { storage = "local-data2", size = "32G" }   # /mnt/docker
cloudinit_storage = "local-data2"
startup = "order=15"       # set at create, checked by verify

# build/setup/, as d04 and test01. d03 is still in build_host.py's LEGACY_HOSTS, whose setup runs
# ~/scripts/d03/setup/<step> (no bashrc.sh there): d03 leaves that list and d03/setup/ goes before
# d03 is built (a build-path change, proven on test01 first).
[setup]
steps = ["systemConfig.sh", "nfs.sh", "docker.sh", "bashrc.sh"]   # no SMB media mount on d03 (live, 2026-10-07)

[[secret]]
var = "D03_BREEDING_RESEARCH_ENV"
path = "/home/docker/scripts/d03/apps/breeding-research/.env"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_TC_DATALOGGER_ENV"
path = "/home/docker/scripts/d03/apps/tc-datalogger/.env"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_BREEDING_RESEARCH_GCP_CREDENTIALS_JSON"
path = "/mnt/docker/breeding-research/gcp-credentials.json"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_CLOUDFLARED_ENV"
path = "/mnt/docker/cloudflared/.env"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_INTERNAL_PROXY_ENV"
path = "/mnt/docker/internal-proxy/.env"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_MS_PROCEDURAL_BACKUP_ENV"     # backup-only token; also re-deliverable by memory-system deliver-backup-token.sh
path = "/home/docker/scripts/d03/apps/ms-procedural-backup/.env"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_MS_CHRONICLE_BACKUP_ENV"      # backup-only token; also re-deliverable by memory-system ms-chronicle-mcp/scripts/deliver-backup-token.sh
path = "/home/docker/scripts/d03/apps/ms-chronicle-backup/.env"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_DOCKER_CONFIG_JSON"           # registry login for gitea.asyla.org images
path = "/home/docker/.docker/config.json"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D03_HOST_MAINTENANCE_SSH_KEY"     # host-maintenance jobs' key into d01-d03
path = "/home/docker/.config/host-maintenance/ssh/id_ed25519"
owner = "docker:docker"
mode = "600"

# d04 first: the runner registers with Gitea on d04 (GITEA_TOKEN_HOST), and breeding-research and
# tc-datalogger pull their images from gitea.asyla.org on d04, so d04 must be up before d03 is
# built. (agent-commons retired 2026-10-08: ms-procedural on the Mini; archive in
# /mnt/nas/data1/docker/agent-commons/mirror.)
[[app]]
name = "breeding-research"
start = ["up"]   # pulls BREEDING_RESEARCH_IMAGE from Gitea's registry on d04 (.env: PULL=1; gap G7)
verify = ["verify"]
[[app]]
name = "tc-datalogger"
verify = ["verify"]
[[app]]
name = "ms-procedural-backup"   # no container: nightly pull of ms-procedural (Mini) into the NAS mirror
start = []
restore = false                 # its data is a copy of the Mini's; the next backup re-pulls it
verify = ["verify"]
[[app]]
name = "ms-chronicle-backup"    # no container: nightly pull of ms-chronicle's verified backup (Mini) into the NAS mirror
start = []
restore = false                 # its data is a copy of the Mini's; the next backup re-pulls it
verify = ["verify"]

[[external]]
name = "internal-access"
repo = "~/local/asyla/projects/internal-access"
run = ["scripts/deploy-host.sh {host}", "scripts/fleet.sh --host {host} restore up verify"]
[[external]]
name = "external-access"
repo = "~/local/asyla/projects/external-access"
run = ["scripts/deploy-host.sh {host}", "scripts/fleet.sh --host {host} up verify"]
[[external]]
name = "host-maintenance runner"
repo = "~/local/asyla/projects/host-maintenance"
manual = "setup/setup-runner-d03.sh with a new project runner token (delete the old host-maintenance-d03 runner in GitLab first)"
[[external]]
name = "theorg-mini-deadman"
repo = "~/local/theOrg"
manual = ".cursor/helpers/runtime-watchdog/install-d03-deadman.sh (theOrg-owned; needs /etc/theorg-deadman/gitea.env)"
[[external]]
name = "GitLab runner 'd03 group' (proxmox-guest-factory CI)"
manual = "pending the factory review (asyla backlog)"

[runner]
enabled = true
