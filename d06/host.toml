# d06 build spec, read by scripts/build_host.py: theOrg's memory and applications host (asyla hub
# decisions/host-layout.md). First tenant: theOrg's ticketing (Vikunja, vikunja-mcp), moved from
# the Mac Mini (asyla hub backlog, the d06 item); then theOrg's observability stack (Loki,
# Prometheus, Alertmanager, alert-relay); then theOrg's communications (NATS, the web chat, the
# Vikunja webhook bridge; not deployed yet); the other stacks follow when theOrg moves them.
# Built as every other Docker host (host-layout decision 6). d06 is not disposable: a build
# or a destroy needs --confirm d06 and the operator's approval of the exact action.
# Not built yet. The ticketing [[app]] and the internal-access [[external]]
# (hosts/d06: vikunja, vikunja-mcp) are from theOrg ticketing DEPLOY.md at main 041215a (the #19
# merge); its images follow `latest` (ticketing.sh). The path is proven on test01 as
# [replica] of = "d06" (ASY-HST-6). The observability [[app]] is from theOrg observability
# DEPLOY.md, last read at main f757911; its images follow `latest` (observability.sh), and the
# revision is read from the images' provenance at deploy (deploy_role.py). The communications
# [[app]] is from theOrg communications DEPLOY.md at beff7c55, its images pinned to that commit.
# external-access deploys d06's own tunnel `d06` (cloudflared-d06, running since 2026-11-10, no routes
# yet) into ~/scripts/d06/apps/external-access/, kept by d06/apps/.gitignore; theorg.asyla.org moves to
# it at the C4 cutover. Every other name here is LAN-only.

# Operator's values, 2026-10-18. order=20: after d04 (10) and d03 (15) when vmh01 boots.
[vm]
node = "vmh01"
vmid = 106
sockets = 1
cores = 8
memory_mb = 16384
ip = "10.0.0.65/24"
os_disk = { storage = "local-data2", size = "64G" }
data_disk = { storage = "local-data2", size = "64G" }   # /mnt/docker: theOrg's stacks' data
cloudinit_storage = "local-data2"
startup = "order=20"                                    # set at create, checked by verify

[setup]
steps = ["systemConfig.sh", "nfs.sh", "docker.sh", "container_dns.sh", "bashrc.sh"]   # build/setup/, sent by the build

# No [[secret]]: d06 keeps no secret on disk (the operator's rule, 2026-10-18). Ticketing's values
# and the proxy's Cloudflare key are resolved from OpenBao on the workstation at use (its [[app]],
# the internal-access [[external]] env).

# Restored from $DOCKER_D1/Ticketing/mirror (theOrg's backup image's copy, mirrored nightly by
# the host that serves vikunja.asyla.org). At the cutover the Mini's final copy is put there first.
# Values the workstation resolves from OpenBao and sends over SSH stdin at use (build_host.py, App
# environment): the theorg-registry pull token for the image pulls (before restore, and for the start),
# and the two Dex client values (identity-platform#25) for the start commands only.
# Its images follow `latest` (ticketing.sh); up pulls only missing ones, so the start pulls first: a
# deploy, by hand or by the workstation's weekly agent (asyla hub tools/redeploy_apps.py), moves the
# running stack to the newest `latest`.
[[app]]
name = "ticketing"
start = ["pull", "up"]
verify = ["verify"]
pull_token_env = "THEORG_REGISTRY_PULL_TOKEN"
start_env = ["TICKETING_DEPLOY_DEX_CLIENT_SECRET", "TICKETING_MCP_DEX_CLIENT_SECRET"]

# theOrg's observability stack (d06/apps/observability, theOrg observability DEPLOY.md last read
# at main f757911; follows latest, the revision read from the images' provenance at deploy). The
# theorg-registry pull token reaches it for the image pulls (OBSERVABILITY_REGISTRY_PULL_TOKEN).
# alert-relay, emporia-collector and scrape-proxy read their secrets from OpenBao in-process:
# deploy_role.py (beside the app) mints each a token from the observability-d06 token role and
# passes it response-wrapped, single use, in the start_env_optional names. No secret goes in a
# container's environment. Optional, not start_env: a ticketing-only or full d06 build passes
# pre-flight without them, and observability.sh leaves a tokened service as it is when its name is
# unset or empty (its README.md, Deploy). No restore: its data has no NAS mirror yet.
[[app]]
name = "observability"
verify = ["verify"]
restore = false
pull_token_env = "THEORG_REGISTRY_PULL_TOKEN"
start_env_optional = ["ALERT_RELAY_OPENBAO_WRAPPED_TOKEN", "EMPORIA_OPENBAO_WRAPPED_TOKEN", "SCRAPE_PROXY_OPENBAO_WRAPPED_TOKEN"]

# theOrg's communications (d06/apps/communications, theOrg communications DEPLOY.md at beff7c55;
# its images pinned to that commit, COMMS_TAG in communications.sh). The theorg-registry pull token
# reaches it for the image pulls (COMMUNICATIONS_REGISTRY_PULL_TOKEN). The five values the start
# needs are resolved from OpenBao (v2/communications/*, its README.md, Secrets) and go only into
# the start commands' environment; communications.sh writes NATS users.conf with references only
# and hands nats the passwords in its environment (README.md, NATS users). Not deployable until
# theOrg's secrets-vault lets hub asyla read those records. Restored from
# $DOCKER_D1/Communications/mirror: since the C4 cutover (2026-11-14) d06 holds the chat data, and
# its nightly backup (host-maintenance, backup d06) keeps the mirror current. A replica of d06 gets
# no start_env, so communications.sh up refuses there: leave it out with [replica] apps.
# The Staff workers' NATS users (COMMS_MQ_USER_<X>_USERNAME/_PASSWORD) are start_env_optional. theOrg
# named the four principals on 2026-11-10 (secrets-vault #55, 6e7fc854): v2/communications/mq-users/
# <name>, username = uid. Optional, so an unprovisioned record is skipped and does not fail the deploy.
# Pass a pair only once identity-platform has provisioned it. Order: provision, then render on d06 and
# the Mini, then redeploy Staff, or that worker gets Authorization Violation.
[[app]]
name = "communications"
start = ["pull", "up"]
verify = ["verify"]
restore = true
pull_token_env = "THEORG_REGISTRY_PULL_TOKEN"
start_env = ["COMMS_POSTGRES_PASSWORD", "COMMS_NATS_WEBHOOK_MQ_USERNAME", "COMMS_NATS_WEBHOOK_MQ_PASSWORD", "COMMS_CHAT_API_TOKEN", "COMMS_VIKUNJA_WEBHOOK_SECRET"]
start_env_optional = ["COMMS_MQ_USER_STAFF_WORKER_1_USERNAME", "COMMS_MQ_USER_STAFF_WORKER_1_PASSWORD", "COMMS_MQ_USER_STAFF_ALERT_TRIAGE_1_USERNAME", "COMMS_MQ_USER_STAFF_ALERT_TRIAGE_1_PASSWORD", "COMMS_MQ_USER_STAFF_DELIVERY_MANAGER_1_USERNAME", "COMMS_MQ_USER_STAFF_DELIVERY_MANAGER_1_PASSWORD", "COMMS_MQ_USER_STAFF_QA_1_USERNAME", "COMMS_MQ_USER_STAFF_QA_1_PASSWORD"]

[[external]]
name = "internal-access"
repo = "~/local/asyla/projects/internal-access"
run = ["scripts/deploy-host.sh {host}", "scripts/fleet.sh --host {host} restore up verify"]
# Caddy's Let's Encrypt DNS-01 key (operator: "OpenBao, at deploy"); fleet.sh sends it over SSH
# stdin as CF_API_TOKEN (internal-access hosts/d06/host.conf TLS_DNS_FROM_WORKSTATION).
env = ["D06_CF_API_TOKEN"]

# Labels as d04's (host-layout decision 3): environment and host, no `docker` and no `asyla`, so
# it never takes the Mini's [theorg, docker] jobs. asyla deploys ticketing here itself (theOrg's
# deploy.yml does not target d06).
[runner]
enabled = true
labels = ["theorg", "prod", "d06"]   # docker/gitea-runner/gitea-runner.sh reads them from here
