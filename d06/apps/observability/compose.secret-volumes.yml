# Added by observability.sh on d06, never on a replica. The operator's rule (2026-11-03): "secrets
# are to live in the vault". Every secret-bearing volume is in memory, filled from OpenBao at each
# deploy, and gone after a reboot or `observability.sh down` until the next deploy (README.md,
# Known limits). A tmpfs volume of the local driver is emptied when its last container exits, so
# secrets-holder mounts them all and stays up: it is started first, before the writes, and
# `up` and `restart` never recreate it (--no-recreate), as ticketing's vikunja-jwt holds its JWT.
# To change a volume's options, remove the volume first (Docker keeps a volume's options).
services:
  secrets-holder:
    image: gitea.asyla.org/theorg/observability-loki-gateway:${OBSERVABILITY_TAG:?}
    container_name: secrets-holder-1
    entrypoint: ["sh", "-c", "trap 'exit 0' TERM INT; while :; do sleep 3600 & wait $$!; done"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - loki-tls:/hold/loki-tls
      - prometheus-trends-tokens:/hold/prometheus-trends-tokens
      - emporia-login:/hold/emporia-login
      - alertmanager-smtp:/hold/alertmanager-smtp
      - alertmanager-healthchecks:/hold/alertmanager-healthchecks
      - alert-relay-healthchecks:/hold/alert-relay-healthchecks
    restart: unless-stopped

# Owner 65534 (Prometheus, Alertmanager and emporia-collector run as nobody; alert-relay is root),
# mode 0700. The Loki TLS volume is root's: Loki and the gateway's nginx read it as root.
volumes:
  loki-tls:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=64k,mode=0700,uid=0,gid=0" }
  prometheus-trends-tokens:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=64k,mode=0700,uid=65534,gid=65534" }
  emporia-login:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=64k,mode=0700,uid=65534,gid=65534" }
  alertmanager-smtp:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=64k,mode=0700,uid=65534,gid=65534" }
  alertmanager-healthchecks:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=64k,mode=0700,uid=65534,gid=65534" }
  alert-relay-healthchecks:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=64k,mode=0700,uid=65534,gid=65534" }
