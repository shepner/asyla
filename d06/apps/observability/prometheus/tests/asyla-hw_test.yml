# promtool unit test of ../rules/asyla-hw.yml (asyla #610 step 5). The ../rules/ layout is the one
# theOrg's scripts/check_deployer_rules.sh expects (DEPLOY.md at 04f3170, "Your own alert rules").
# Run (prom/prometheus:v2.55.1 is the base of theOrg's observability-prometheus at 04f3170):
#   docker run --rm -v "$PWD/d06/apps/observability/prometheus:/r:ro" -w /r/tests --entrypoint promtool prom/prometheus:v2.55.1 test rules asyla-hw_test.yml
# Series in the shape the asyla-hw job scrapes them: the checker's own host label beside the
# exporter's instance (d03.asyla.org:9100 serves nas01's smart.prom).
rule_files:
  - ../rules/asyla-hw.yml
evaluation_interval: 1m

tests:
  # Problems: urgent fires at once, a warning after 10 minutes, a short warning never; both keep
  # firing through a missed scrape.
  - interval: 1m
    input_series:
      - series: 'up{job="asyla-hw",instance="vmh02.asyla.org:9100"}'
        values: '1x40'
      - series: 'up{job="asyla-hw",instance="d04.asyla.org:9100"}'
        values: '1x40'
      - series: 'asyla_hw_check_last_run_timestamp_seconds{job="asyla-hw",instance="vmh02.asyla.org:9100",host="vmh02",checker="vmh-health"}'
        values: '0+60x40'
      - series: 'asyla_hw_check_last_run_timestamp_seconds{job="asyla-hw",instance="d04.asyla.org:9100",host="d04",checker="guest-health"}'
        values: '0+60x40'
      - series: 'asyla_hw_check_last_run_timestamp_seconds{job="asyla-hw",instance="d03.asyla.org:9100",host="nas01",checker="nas-smart"}'
        values: '0+60x40'
      # Present 0-3m, then gone (cleared, or missed scrapes).
      - series: 'asyla_hw_problem{job="asyla-hw",instance="vmh02.asyla.org:9100",host="vmh02",key="bmc.sel.Memory.Uncorrectable_ECC",severity="urgent"}'
        values: '1 1 1 1'
      - series: 'asyla_hw_problem{job="asyla-hw",instance="d04.asyla.org:9100",host="d04",key="kern.fs-error",severity="warning"}'
        values: '1x40'
      # A warning seen for 1 minute (present until 6m with the 5m lookback): never fires.
      - series: 'asyla_hw_problem{job="asyla-hw",instance="d03.asyla.org:9100",host="nas01",key="smart.S1.reallocated_sectors",severity="warning"}'
        values: '1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: AsylaHwProblemUrgent
        exp_alerts:
          - exp_labels: &urgent
              alertname: AsylaHwProblemUrgent
              job: asyla-hw
              instance: vmh02.asyla.org:9100
              host: vmh02
              key: bmc.sel.Memory.Uncorrectable_ECC
              severity: urgent
              alert_repo: asyla/asyla-hosts
              name: vmh02:hw:bmc.sel.Memory.Uncorrectable_ECC
            exp_annotations: &urgent_ann
              summary: "vmh02: urgent hardware problem bmc.sel.Memory.Uncorrectable_ECC"
              description: "The vmh02 hardware checker reports bmc.sel.Memory.Uncorrectable_ECC as urgent. Its own output (status.json on nas01, vmh/apply.sh health NODE on a vmh, maint_host.py check on a guest) has the detail."
              runbook_url: https://gitlab.com/asyla/asyla-hosts/-/blob/master/d06/apps/observability/README.md#hardware-alerts-asyla-610
      - eval_time: 0m
        alertname: AsylaHwProblemUrgent
        exp_alerts:
          - exp_labels: *urgent
            exp_annotations: *urgent_ann
      # Last sample at 3m; still firing 15 minutes on (keep_firing_for), gone after.
      - eval_time: 15m
        alertname: AsylaHwProblemUrgent
        exp_alerts:
          - exp_labels: *urgent
            exp_annotations: *urgent_ann
      - eval_time: 25m
        alertname: AsylaHwProblemUrgent
        exp_alerts: []
      - eval_time: 9m
        alertname: AsylaHwProblemWarning
        exp_alerts: []
      - eval_time: 11m
        alertname: AsylaHwProblemWarning
        exp_alerts:
          - exp_labels:
              alertname: AsylaHwProblemWarning
              job: asyla-hw
              instance: d04.asyla.org:9100
              host: d04
              key: kern.fs-error
              severity: warning
              alert_repo: asyla/asyla-hosts
              name: d04:hw:kern.fs-error
            exp_annotations:
              summary: "d04: hardware warning kern.fs-error"
              description: "The d04 hardware checker has reported kern.fs-error as a warning for 10 minutes. Its own output (status.json on nas01, vmh/apply.sh health NODE on a vmh, maint_host.py check on a guest) has the detail."
              runbook_url: https://gitlab.com/asyla/asyla-hosts/-/blob/master/d06/apps/observability/README.md#hardware-alerts-asyla-610
      # Checkers that keep running are neither stale nor missing.
      - eval_time: 40m
        alertname: AsylaHwCheckerStale
        exp_alerts: []
      - eval_time: 40m
        alertname: AsylaHwCheckerMissing
        exp_alerts: []

  # Stale: vmh03's checker stopped at 0m (limit 30m), nas01's export at 0m (limit 3h); vmh01 runs on.
  - interval: 1m
    input_series:
      - series: 'asyla_hw_check_last_run_timestamp_seconds{job="asyla-hw",instance="vmh03.asyla.org:9100",host="vmh03",checker="vmh-health"}'
        values: '0x200'
      - series: 'asyla_hw_check_last_run_timestamp_seconds{job="asyla-hw",instance="vmh01.asyla.org:9100",host="vmh01",checker="vmh-health"}'
        values: '0+60x200'
      - series: 'asyla_hw_check_last_run_timestamp_seconds{job="asyla-hw",instance="d03.asyla.org:9100",host="nas01",checker="nas-smart"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 29m
        alertname: AsylaHwCheckerStale
        exp_alerts: []
      - eval_time: 31m
        alertname: AsylaHwCheckerStale
        exp_alerts:
          - exp_labels:
              alertname: AsylaHwCheckerStale
              job: asyla-hw
              instance: vmh03.asyla.org:9100
              host: vmh03
              checker: vmh-health
              severity: warning
              alert_repo: asyla/asyla-hosts
              name: vmh03:hw:stale.vmh-health
            exp_annotations:
              summary: "vmh03: hardware checker vmh-health last ran 31m 0s ago"
              description: "No new run of vmh-health on vmh03 (limit 3h for nas-smart, 30m for the others): its hardware problems are not being checked."
              runbook_url: https://gitlab.com/asyla/asyla-hosts/-/blob/master/d06/apps/observability/README.md#hardware-alerts-asyla-610
      - eval_time: 181m
        alertname: AsylaHwCheckerStale
        exp_alerts:
          - exp_labels:
              alertname: AsylaHwCheckerStale
              job: asyla-hw
              instance: vmh03.asyla.org:9100
              host: vmh03
              checker: vmh-health
              severity: warning
              alert_repo: asyla/asyla-hosts
              name: vmh03:hw:stale.vmh-health
            exp_annotations:
              summary: "vmh03: hardware checker vmh-health last ran 3h 1m 0s ago"
              description: "No new run of vmh-health on vmh03 (limit 3h for nas-smart, 30m for the others): its hardware problems are not being checked."
              runbook_url: https://gitlab.com/asyla/asyla-hosts/-/blob/master/d06/apps/observability/README.md#hardware-alerts-asyla-610
          - exp_labels:
              alertname: AsylaHwCheckerStale
              job: asyla-hw
              instance: d03.asyla.org:9100
              host: nas01
              checker: nas-smart
              severity: warning
              alert_repo: asyla/asyla-hosts
              name: nas01:hw:stale.nas-smart
            exp_annotations:
              summary: "nas01: hardware checker nas-smart last ran 3h 1m 0s ago"
              description: "No new run of nas-smart on nas01 (limit 3h for nas-smart, 30m for the others): its hardware problems are not being checked."
              runbook_url: https://gitlab.com/asyla/asyla-hosts/-/blob/master/d06/apps/observability/README.md#hardware-alerts-asyla-610
      - eval_time: 179m
        alertname: AsylaHwCheckerStale
        exp_alerts:
          - exp_labels:
              alertname: AsylaHwCheckerStale
              job: asyla-hw
              instance: vmh03.asyla.org:9100
              host: vmh03
              checker: vmh-health
              severity: warning
              alert_repo: asyla/asyla-hosts
              name: vmh03:hw:stale.vmh-health
            exp_annotations:
              summary: "vmh03: hardware checker vmh-health last ran 2h 59m 0s ago"
              description: "No new run of vmh-health on vmh03 (limit 3h for nas-smart, 30m for the others): its hardware problems are not being checked."
              runbook_url: https://gitlab.com/asyla/asyla-hosts/-/blob/master/d06/apps/observability/README.md#hardware-alerts-asyla-610

  # Missing: d05's exporter answers with no checker series, and nas01's export is gone entirely.
  - interval: 1m
    input_series:
      - series: 'up{job="asyla-hw",instance="d05.asyla.org:9100"}'
        values: '1x40'
      - series: 'up{job="asyla-hw",instance="d06.asyla.org:9100"}'
        values: '1x40'
      - series: 'asyla_hw_check_last_run_timestamp_seconds{job="asyla-hw",instance="d06.asyla.org:9100",host="d06",checker="guest-health"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 29m
        alertname: AsylaHwCheckerMissing
        exp_alerts: []
      - eval_time: 31m
        alertname: AsylaHwCheckerMissing
        exp_alerts:
          - exp_labels:
              alertname: AsylaHwCheckerMissing
              job: asyla-hw
              instance: d05.asyla.org:9100
              severity: warning
              alert_repo: asyla/asyla-hosts
              name: d05.asyla.org:9100:hw:missing
            exp_annotations:
              summary: "d05.asyla.org:9100: no hardware checker series for 30 minutes"
              description: "The asyla-hw job reads no asyla_hw_check_last_run_timestamp_seconds from this exporter (or none for nas01): the checker's textfile is missing, so its hardware problems are not seen."
              runbook_url: https://gitlab.com/asyla/asyla-hosts/-/blob/master/d06/apps/observability/README.md#hardware-alerts-asyla-610
          - exp_labels:
              alertname: AsylaHwCheckerMissing
              host: nas01
              checker: nas-smart
              severity: warning
              alert_repo: asyla/asyla-hosts
              name: nas01:hw:missing
            exp_annotations:
              summary: "nas01: no hardware checker series for 30 minutes"
              description: "The asyla-hw job reads no asyla_hw_check_last_run_timestamp_seconds from this exporter (or none for nas01): the checker's textfile is missing, so its hardware problems are not seen."
              runbook_url: https://gitlab.com/asyla/asyla-hosts/-/blob/master/d06/apps/observability/README.md#hardware-alerts-asyla-610
