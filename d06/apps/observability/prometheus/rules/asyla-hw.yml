# asyla's hardware-problem alerts (asyla #610 step 5), evaluated by d06's operations Prometheus:
# this directory is mounted over /etc/prometheus/rules (theOrg observability DEPLOY.md at 04f3170,
# "Your own alert rules"; README.md here, "Hardware alerts"). Only *.yml rule files belong here:
# Prometheus loads every *.yml in it, so the tests live in ../tests/.
#
# The series come from the asyla checkers through node_exporter textfiles, scraped by the job
# asyla-hw (../scrape/asyla-hw.yml):
#   asyla_hw_problem{host,key,severity} 1     one series per open problem; severity "warning" or
#                                             "urgent", never "critical" (that one also emails)
#   asyla_hw_check_last_run_timestamp_seconds{host,checker}
# Checkers and how often they run (the stale limits follow):
#   nas-smart   nas01, the asyla hub's tools/export_nas_smart.py, TrueNAS cron job 9 hourly at :17;
#               served by d03's node_exporter (smart.prom)                          -> stale after 3h
#   vmh-health  vmh01-03, vmh/health.sh, run by host-maintenance's monitor every 15 min -> 30m
#   guests      d01-d07, host-maintenance's monitor every 15 min (guest-health.prom)    -> 30m
#
# Check before a deploy (README.md, "Hardware alerts"):
#   docker run --rm -v "$PWD/d06/apps/observability/prometheus:/r:ro" -w /r/tests --entrypoint promtool prom/prometheus:v2.55.1 test rules asyla-hw_test.yml
groups:
  - name: asyla-hw
    rules:
      # keep_firing_for: one missed scrape makes the series stale for a moment; without it each
      # miss would resolve the alert and open a new task.
      - alert: AsylaHwProblemUrgent
        expr: asyla_hw_problem{severity="urgent"} == 1
        keep_firing_for: 15m
        labels:
          severity: urgent
          alert_repo: asyla/asyla-hosts
          name: "{{ $labels.host }}:hw:{{ $labels.key }}"
        annotations:
          summary: "{{ $labels.host }}: urgent hardware problem {{ $labels.key }}"
          description: "The {{ $labels.host }} hardware checker reports {{ $labels.key }} as urgent. Its own output (status.json on nas01, vmh/apply.sh health NODE on a vmh, maint_host.py check on a guest) has the detail."
          runbook_url: https://gitlab.com/asyla/asyla-hosts/-/blob/master/d06/apps/observability/README.md#hardware-alerts-asyla-610

      - alert: AsylaHwProblemWarning
        expr: asyla_hw_problem{severity="warning"} == 1
        for: 10m
        keep_firing_for: 15m
        labels:
          severity: warning
          alert_repo: asyla/asyla-hosts
          name: "{{ $labels.host }}:hw:{{ $labels.key }}"
        annotations:
          summary: "{{ $labels.host }}: hardware warning {{ $labels.key }}"
          description: "The {{ $labels.host }} hardware checker has reported {{ $labels.key }} as a warning for 10 minutes. Its own output (status.json on nas01, vmh/apply.sh health NODE on a vmh, maint_host.py check on a guest) has the detail."
          runbook_url: https://gitlab.com/asyla/asyla-hosts/-/blob/master/d06/apps/observability/README.md#hardware-alerts-asyla-610

      # A checker that stopped running reports no problem, so its silence is a problem of its own.
      - alert: AsylaHwCheckerStale
        # Every checker runs hourly: nas01's cron job 9 at :17, and host-maintenance's monitor, whose
        # */15 schedule GitLab Free runs once an hour (seen 2026-11-23: pipelines at :07). 3h is two
        # missed runs and margin. The first limit, 30m for the monitor's checkers, fired on all three
        # vmh nodes between hourly runs (asyla #610 step 5).
        expr: time() - asyla_hw_check_last_run_timestamp_seconds > 3 * 3600
        labels:
          severity: warning
          alert_repo: asyla/asyla-hosts
          name: "{{ $labels.host }}:hw:stale.{{ $labels.checker }}"
        annotations:
          summary: "{{ $labels.host }}: hardware checker {{ $labels.checker }} last ran {{ $value | humanizeDuration }} ago"
          description: "No new run of {{ $labels.checker }} on {{ $labels.host }} (limit 3h; every checker runs hourly): its hardware problems are not being checked."
          runbook_url: https://gitlab.com/asyla/asyla-hosts/-/blob/master/d06/apps/observability/README.md#hardware-alerts-asyla-610

      # An exporter that answers but serves no checker's series (the textfile was never written or
      # was removed), and nas01's export, which d03 serves beside d03's own.
      - alert: AsylaHwCheckerMissing
        expr: >
          (up{job="asyla-hw"} == 1 unless on (instance) asyla_hw_check_last_run_timestamp_seconds)
          or
          absent(asyla_hw_check_last_run_timestamp_seconds{host="nas01",checker="nas-smart"})
        for: 30m
        labels:
          severity: warning
          alert_repo: asyla/asyla-hosts
          name: "{{ if $labels.host }}{{ $labels.host }}{{ else }}{{ $labels.instance }}{{ end }}:hw:missing"
        annotations:
          summary: "{{ if $labels.host }}{{ $labels.host }}{{ else }}{{ $labels.instance }}{{ end }}: no hardware checker series for 30 minutes"
          description: "The asyla-hw job reads no asyla_hw_check_last_run_timestamp_seconds from this exporter (or none for nas01): the checker's textfile is missing, so its hardware problems are not seen."
          runbook_url: https://gitlab.com/asyla/asyla-hosts/-/blob/master/d06/apps/observability/README.md#hardware-alerts-asyla-610
