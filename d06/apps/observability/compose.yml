# theOrg's observability stack on d06: Loki, Prometheus, the trends Prometheus, Alertmanager,
# alert-relay, emporia-collector, scrape-proxy, the pushgateway, Vector, docker-state-exporter and
# blackbox-exporter. Written by asyla from theOrg observability docker-compose.yml,
# compose.docker-socket.yml and compose.blackbox.yml, last read at main
# f7579118fdac5d90101a5ec6698200ae2c9d836f (#327; design 4 since #311; DEPLOY.md at that sha).
# The images follow theOrg's `latest`; the revision is read from the images' provenance at deploy.
# Project, container names, volume names and the network are theOrg's. asyla's choices:
# - the Docker-socket and blackbox pieces are folded in; credential-probe, the Ollama log and
#   MONITOR_THEORG (theOrg's other stacks' jobs and rules) are not here;
# - no loki-gateway (theOrg lead's option A for d06, 2026-11-03): its f757911 service needs a
#   loki-gateway identity in the observability-d06 token role and a step-ca provisioner and name
#   for d06, none of which exist yet (README.md, On, off). observability.sh's `up` removes the
#   container an earlier deploy left (--remove-orphans);
# - no build sections: theOrg's published images of OBSERVABILITY_TAG (observability.sh: latest);
# - no port on every address: every port on 127.0.0.1 only (Alertmanager on 9093, the
#   pushgateway on 9091, docker-state-exporter on 9099);
# - Loki, both Prometheus and Alertmanager keep their data on d06's local data disk, as named
#   volumes bound to OBSERVABILITY_ROOT (theOrg decision asyla-network-monitoring §8: never NFS);
# - no secret is in any file, volume or container environment (asyla SEC-5 and SEC-7; the
#   operator, 2026-11-03: secrets live only in OpenBao). alert-relay, emporia-collector and
#   scrape-proxy each read theirs from OpenBao in-process with their own token: deploy_role.py
#   (beside this file) mints it from the observability-d06 token role and passes it
#   response-wrapped, single use, in <NAME>_OPENBAO_WRAPPED_TOKEN. Each container spends it at
#   start, so what Docker keeps is a spent wrapping token. The *_KV settings name asyla's records
#   (the role's policies, secrets-vault policies/hubs.toml). A tokened service starts only with its
#   token (observability.sh); after a reboot or a Docker restart it loops until the next deploy.
#
# On: alert issues (alert-relay files each alert in GITEA_ALERT_REPO, asyla/alerts, with the forge
# token it reads), the email receiver (Alertmanager's email piece, sent by alert-relay with the
# SMTP login), the Watchdog ping (Alertmanager's watchdog piece, ALERT_WATCHDOG_PING "on" in
# observability.sh; alert-relay pings healthchecks.io with the URL it reads), the delivery ping
# (alert-relay pings its own healthchecks.io check after each delivery and its forge self-test),
# the trends Home Assistant job (through scrape-proxy), emporia-collector, and Vector's
# container-log pipeline (VECTOR_DOCKER_LOGS: this stack's own logs to Loki, plain HTTP inside
# observability-net).
# Off (README.md says what turns each on). Each is off here and nowhere else:
#   alert-relay log lines LOKI_QUERY_URL is empty: the relay needs a query password too
#                         (relay.py), and ALERT_RELAY_LOKI_KV is not set
#   Loki gateway          not in this file: no caller off this host pushes to or queries Loki
#
# Run with observability.sh: it sets OBSERVABILITY_TAG, OBSERVABILITY_ROOT and the settings below
# and keeps the start order.
name: observability

services:
  pushgateway:
    image: prom/pushgateway:v1.11.1
    container_name: pushgateway-1
    ports:
      - "127.0.0.1:9091:9091"
    restart: unless-stopped
    networks:
      - observability-net

  # Alertmanager holds no secret. Every alert goes to alert-relay (the base configuration). Its
  # email piece is on with ALERT_EMAIL_TO (a webhook to alert-relay's /email); its watchdog piece
  # with ALERT_WATCHDOG_PING ("on", observability.sh): the Watchdog to alert-relay's /watchdog
  # every 5 to 6 minutes, which pings the check with the URL the relay reads from OpenBao.
  alertmanager:
    image: gitea.asyla.org/theorg/observability-alertmanager:${OBSERVABILITY_TAG:?}
    container_name: alertmanager-1
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?}
      ALERT_WATCHDOG_PING: ${ALERT_WATCHDOG_PING:-}
    volumes:
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Links in notifications (scheme://host:port, no path, so the route prefix stays /).
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:?}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9093/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - observability-net

  # Files every alert as an issue in GITEA_ALERT_REPO (asyla/alerts) on the forge, off this host,
  # and sends the critical ones by email. It reads every secret from OpenBao in-process
  # (alert-relay/relay.py): ALERT_RELAY_<SECRET>_KV is PATH#FIELD. A record it cannot read switches
  # that feature off, logged at start (the category, never a value). The forge token is the
  # relay's gitea account's; the delivery ping URL is the delivery check's on healthchecks.io.
  # Holding that URL, the relay runs its forge self-test at start and then daily (the token
  # searches asyla/alerts' issues) and pings the check after each self-test and each delivery:
  # success, or the check's /fail, which takes it down and pages (theOrg alert-relay/relay.py
  # delivery_selftest, record_selftest). So the two go on together: the URL without a working
  # token pages at the first start. verify checks both (check_tokened, check_delivery). The Loki
  # and chat-api records keep theOrg's defaults, which this token cannot read ("refused"); those
  # features are off here (LOKI_QUERY_URL and CHAT_API_URL empty). Loki itself needs no account in
  # the stack, but the relay fetches log lines only with LOKI_QUERY_URL and its query password
  # both set (relay.py log_section and its start line), so loki:3100 here alone would change
  # nothing.
  alert-relay:
    image: gitea.asyla.org/theorg/observability-alert-relay:${OBSERVABILITY_TAG:?}
    container_name: alert-relay-1
    ports:
      - "127.0.0.1:9111:9111"
    environment:
      OPENBAO_ADDR: ${OPENBAO_ADDR:?}
      OPENBAO_WRAPPED_TOKEN: ${ALERT_RELAY_OPENBAO_WRAPPED_TOKEN:-}
      ALERT_RELAY_FORGE_KV: "secret/hubs/asyla/observability-alert-relay-gitea-token#value"
      ALERT_RELAY_SMTP_USERNAME_KV: "secret/hubs/asyla/smtp-relay-username#value"
      ALERT_RELAY_SMTP_PASSWORD_KV: "secret/hubs/asyla/smtp-relay-password#value"
      ALERT_RELAY_WATCHDOG_PING_KV: "secret/hubs/asyla/observability-watchdog-ping-url#value"
      ALERT_RELAY_DELIVERY_PING_KV: "secret/hubs/asyla/observability-delivery-ping-url#value"
      GITEA_URL: ${GITEA_URL:?}
      GITEA_ALERT_REPO: ${GITEA_ALERT_REPO:?}
      ALERT_REPOS: ${ALERT_REPOS:-}
      LOKI_QUERY_URL: ""
      CHAT_API_URL: ""
      # Critical alerts by email: the recipient; the sender defaults to the SMTP username.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?}
      ALERT_EMAIL_SMARTHOST: "smtp.gmail.com:587"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9101/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - observability-net

  loki:
    image: gitea.asyla.org/theorg/observability-loki:${OBSERVABILITY_TAG:?}
    container_name: loki-1
    # Not published, and plain HTTP (theOrg's only configuration at f757911): Vector pushes and
    # Prometheus scrapes loki:3100 on observability-net. Nothing off this host reaches it. The
    # Prometheus job asks plain HTTP since #327 (prometheus/scrape-stack/loki.yml); at 64a2bf3 it
    # asked https and d06 read up{job="loki"} 0 (2026-11-03).
    volumes:
      - loki-data:/loki
    # Unset here, so the configs' own defaults apply (744h, 0.05 MB/s, burst 16; DEPLOY.md).
    environment:
      - LOKI_RETENTION_PERIOD
      - LOKI_INGESTION_RATE_MB
      - LOKI_INGESTION_BURST_SIZE_MB
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-net

  # loki-gateway is theOrg's and not here (option A; the header and README.md say why). Option B
  # adds it back with d06's own settings: identity, provisioner, step-ca address and KV paths.

  prometheus:
    image: gitea.asyla.org/theorg/observability-prometheus:${OBSERVABILITY_TAG:?}
    container_name: prometheus-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    # prometheus-entrypoint.sh enables the two pieces' scrape jobs (folded in from theOrg's
    # compose.docker-socket.yml and compose.blackbox.yml). MONITOR_THEORG stays unset, so no job
    # here reads a token.
    environment:
      SCRAPE_DOCKER_STATE_EXPORTER: "true"
      SCRAPE_BLACKBOX_EXPORTER: "true"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}
      - --web.external-url=${PROMETHEUS_EXTERNAL_URL:?}
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-net

  # Long-term capacity and trend data; size retention only (24 GiB, sized for this 64 GiB disk).
  # Its baked-in jobs include asyla's Home Assistant (through scrape-proxy:9119, no token file)
  # and emporia-collector's own (emporia-collector:9108).
  prometheus-trends:
    image: gitea.asyla.org/theorg/observability-prometheus-trends:${OBSERVABILITY_TAG:?}
    container_name: prometheus-trends-1
    ports:
      - "127.0.0.1:9107:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.size=${TRENDS_RETENTION_SIZE:-24GB}
      # emporia-collector writes here. The receiver answers on the same port as queries, so
      # anything that reaches 9107 can write: trend data only.
      - --web.enable-remote-write-receiver
    volumes:
      - prometheus-trends-data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-net

  # Emporia Vue minute data into prometheus-trends by remote write, backfilling what Emporia still
  # holds (emporia-collector/collector.py). Its own /metrics (9108) is not published. The Emporia
  # login is read from OpenBao in-process: *_KV is a plain path, the field EMPORIA_KV_FIELD
  # (default value). With no token at all it exits, so it starts only with its token.
  emporia-collector:
    image: gitea.asyla.org/theorg/observability-emporia-collector:${OBSERVABILITY_TAG:?}
    container_name: emporia-collector-1
    depends_on:
      prometheus-trends:
        condition: service_healthy
    environment:
      TRENDS_URL: http://prometheus-trends:9090
      OPENBAO_ADDR: ${OPENBAO_ADDR:?}
      OPENBAO_WRAPPED_TOKEN: ${EMPORIA_OPENBAO_WRAPPED_TOKEN:-}
      EMPORIA_USERNAME_KV: secret/hubs/asyla/emporia-username
      EMPORIA_PASSWORD_KV: secret/hubs/asyla/emporia-password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/metrics', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - observability-net

  # The trends Prometheus scrapes Home Assistant through this (/scrape/home-assistant), so no token
  # is in a file (scrape-proxy/proxy.py). It reads the token from OpenBao in-process:
  # HOME_ASSISTANT_TOKEN_KV is a plain path, the field HOME_ASSISTANT_TOKEN_FIELD (default value).
  # Port 9119 is not published: only observability-net reaches it.
  scrape-proxy:
    image: gitea.asyla.org/theorg/observability-scrape-proxy:${OBSERVABILITY_TAG:?}
    container_name: scrape-proxy-1
    environment:
      OPENBAO_WRAPPED_TOKEN: ${SCRAPE_PROXY_OPENBAO_WRAPPED_TOKEN:-}
      OPENBAO_ADDR: ${OPENBAO_ADDR:?}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:?}
      HOME_ASSISTANT_TOKEN_KV: secret/hubs/asyla/home-assistant-prometheus-token
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - observability-net

  # With the Docker socket (folded in from compose.docker-socket.yml): this stack's own logs to Loki
  # over plain HTTP inside observability-net (theOrg vector-docker-logs.toml at f757911 has no tls
  # block and names no CA file), and its CHRONICLE_EPISODE lines to memory-system's Vector
  # (CHRONICLE_VECTOR_ADDRESS). observability.sh verify reads the lines back from loki:3100.
  # The socket bind matches theOrg's compose.docker-socket.yml. Its :ro does not make the Docker
  # API read-only: whatever connects to the socket has the whole API. Vector's only inputs are
  # internal_metrics and docker_logs limited to compose project observability (theOrg vector.toml,
  # vector-docker-logs.toml). A socket proxy would be theOrg's change.
  vector:
    image: gitea.asyla.org/theorg/observability-vector:${OBSERVABILITY_TAG:?}
    container_name: vector-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9598:9598"
    depends_on:
      loki:
        condition: service_healthy
    user: root
    volumes:
      - vector-disk-buffer:/var/lib/vector
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      VECTOR_LOG: info
      LOKI_ADDRESS: loki:3100
      CHRONICLE_VECTOR_ADDRESS: ${CHRONICLE_VECTOR_ADDRESS:?}
      # vector-entrypoint.sh loads vector-docker-logs.toml when this is true. On since 64a2bf3; it
      # was off on d06 at 7572365 (that sink named /etc/loki-ca/root_ca.crt; Vector refused to
      # start).
      VECTOR_DOCKER_LOGS: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9598/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - observability-net

  # Container lifecycle metrics for every container on this daemon (theOrg's
  # compose.docker-socket.yml, folded in; published on 127.0.0.1 only). Its socket bind is theOrg's
  # too: the :ro does not make the Docker API read-only (as for vector, above).
  docker-state-exporter:
    image: gitea.asyla.org/theorg/observability-docker-state-exporter:${OBSERVABILITY_TAG:?}
    container_name: docker-state-exporter-1
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9099/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - observability-net

  # Probes (theOrg's compose.blackbox.yml, folded in). Not published: anything that reaches /probe
  # can make it connect anywhere this host can. Prometheus's blackbox-selftest job probes
  # Prometheus itself over HTTP, TCP and ICMP (observability.sh verify reads the three).
  blackbox-exporter:
    image: gitea.asyla.org/theorg/observability-blackbox-exporter:${OBSERVABILITY_TAG:?}
    container_name: blackbox-exporter-1
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9115/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - observability-net

volumes:
  # Data, on d06's local data disk (observability.sh creates and owns the directories).
  alertmanager-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${OBSERVABILITY_ROOT:?}/alertmanager-data" }
  loki-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${OBSERVABILITY_ROOT:?}/loki-data" }
  prometheus-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${OBSERVABILITY_ROOT:?}/prometheus-data" }
  prometheus-trends-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${OBSERVABILITY_ROOT:?}/prometheus-trends-data" }
  vector-disk-buffer:
    name: observability-vector-disk-buffer

networks:
  observability-net:
    driver: bridge
