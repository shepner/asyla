# theOrg's observability stack on d06: Loki, its gateway, Prometheus, the trends and ingest Prometheus,
# Alertmanager, alert-relay, emporia-collector, scrape-proxy, the pushgateway, Vector,
# docker-state-exporter and blackbox-exporter. Written by asyla from theOrg observability docker-compose.yml,
# compose.docker-socket.yml and compose.blackbox.yml, last read at main
# f7579118fdac5d90101a5ec6698200ae2c9d836f (#327; design 4 since #311; DEPLOY.md at that sha).
# The images follow theOrg's `latest`; the revision is read from the images' provenance at deploy.
# Project, container names, volume names and the network are theOrg's. asyla's choices:
# - the Docker-socket and blackbox pieces are folded in; credential-probe, the Ollama log and
#   MONITOR_THEORG (theOrg's other stacks' jobs and rules) are not here;
# - three gateways from theOrg's loki-gateway image with d06's own settings (theOrg's option B and
#   route modes, asyla #1268): loki-gateway (mode loki), prometheus-write-gateway (remote-write, in
#   front of prometheus-ingest) and pushgateway-gateway (pushgateway). Each is plain HTTP
#   (LOKI_GATEWAY_TLS off), so no step-ca, provisioner or loki-ca volume; TLS ends at d06's Caddy
#   as loki.asyla.org, prometheus-write.asyla.org and pushgateway.asyla.org (internal-access
#   hosts/d06). Caddy forwards each caller's Basic auth in plain text, so that hop is on its own
#   internal network, loki-edge (observability-loki-edge; the name is historical: it carries all
#   three gateways' hops), which only the three gateways and caddy-internal-d06 join. Each checks its own accounts (loki-clients.toml,
#   prometheus-write-clients.toml, pushgateway-clients.toml), read from OpenBao under its own
#   prefix in secret/hubs/asyla/own/; observability.sh passes each its accounts
#   (LOKI_GATEWAY_ACCOUNTS, PROMETHEUS_WRITE_GATEWAY_ACCOUNTS, PUSHGATEWAY_GATEWAY_ACCOUNTS) as its
#   LOKI_GATEWAY_ACCOUNTS;
# - remote writes go to prometheus-ingest (receiver on), on its own internal network, ingest
#   (observability-ingest), with only prometheus-write-gateway and the operations Prometheus; the
#   pushgateway is on its own, push (observability-push), with only pushgateway-gateway and the
#   operations Prometheus, which scrapes it there (theOrg DEPLOY.md, "Where the writes go");
# - prometheus-ingest is theOrg's compose.ingest.yml at 04f31709 (the operations image with
#   PROMETHEUS_MODE=ingest: no job, no rule, 1d/2GB), and the operations Prometheus federates it
#   (FEDERATE_INGEST=true: the job ingest-federate, one match[] per theOrg job name), folded in
#   here as the other pieces are; the pushgateway's 127.0.0.1:9091 publish is dropped (nothing on
#   d06 used it);
# - no build sections: theOrg's published images of OBSERVABILITY_TAG (observability.sh: latest);
# - no port on every address: every port on 127.0.0.1 only (Alertmanager on 9093,
#   docker-state-exporter on 9099); the pushgateway has none (nothing on d06 pushes to it);
# - Loki, the three Prometheus and Alertmanager keep their data on d06's local data disk, as named
#   volumes bound to OBSERVABILITY_ROOT (theOrg decision asyla-network-monitoring §8: never NFS);
# - no secret is in any file, volume or container environment (asyla SEC-5 and SEC-7; the
#   operator, 2026-11-03: secrets live only in OpenBao). alert-relay, emporia-collector,
#   scrape-proxy and the three gateways each read theirs from OpenBao in-process with their own token:
#   deploy_role.py (beside this file) mints it from the observability-d06 token role and passes it
#   response-wrapped, single use, in <NAME>_OPENBAO_WRAPPED_TOKEN. Each container spends it at
#   start, so what Docker keeps is a spent wrapping token. The *_KV settings name asyla's records
#   (the role's policies, secrets-vault policies/hubs.toml). A tokened service starts only with its
#   token (observability.sh); after a reboot or a Docker restart it loops until the next deploy.
#
# On: alert tasks (alert-relay files each alert as a task in Vikunja project 170, asyla's child of
# theOrg's Alerts project, or 169, theOrg's, for an alert whose alert_repo names theOrg;
# ALERT_PROJECTS in observability.sh, with the Vikunja token it reads),
# the email receiver (Alertmanager's email piece, sent by alert-relay with the
# SMTP login), the Watchdog ping (Alertmanager's watchdog piece, ALERT_WATCHDOG_PING "on" in
# observability.sh; alert-relay pings healthchecks.io with the URL it reads), the delivery ping
# (alert-relay pings its own healthchecks.io check after each delivery and its Vikunja self-test),
# the trends Home Assistant job (through scrape-proxy), emporia-collector, Vector's
# container-log pipeline (VECTOR_DOCKER_LOGS: this stack's own logs to Loki, plain HTTP inside
# observability-net), and alert-relay's log lines (an alert's logql annotation run against
# loki:3100 inside observability-net, the lines put in its task; README.md, On, off), the Loki
# gateway (pushes and queries from off this host, each with its own account, as loki.asyla.org),
# and the remote-write and pushgateway gateways (writes from off this host, each with its own
# account; remote writes land in prometheus-ingest, federated by the operations Prometheus).
# Off (README.md says what turns each on): chat-api (CHAT_API_URL empty).
#
# Run with observability.sh: it sets OBSERVABILITY_TAG, OBSERVABILITY_ROOT and the settings below
# and keeps the start order.
name: observability

services:
  # Anything that reaches the pushgateway can push or wipe, with no account. So it is on push
  # (observability-push) alone, an internal network that only pushgateway-gateway (the one way in,
  # with an account) and its scraper, the operations Prometheus, join (theOrg DEPLOY.md, "Where the
  # writes go"). theOrg's job (prometheus/scrape-stack/pushgateway.yml) scrapes pushgateway:9091 by
  # service name, which resolves on push. No port: nothing on d06 pushes to it (asyla #1268: no
  # 9091 in asyla-hosts but this file and the README, nor any pushgateway caller).
  pushgateway:
    image: prom/pushgateway:v1.11.1
    container_name: pushgateway-1
    restart: unless-stopped
    networks:
      - push

  # Alertmanager holds no secret. Every alert goes to alert-relay (the base configuration). Its
  # email piece is on with ALERT_EMAIL_TO (a webhook to alert-relay's /email); its watchdog piece
  # with ALERT_WATCHDOG_PING ("on", observability.sh): the Watchdog to alert-relay's /watchdog
  # every 5 to 6 minutes, which pings the check with the URL the relay reads from OpenBao.
  alertmanager:
    image: gitea.asyla.org/theorg/observability-alertmanager:${OBSERVABILITY_TAG:?}
    container_name: alertmanager-1
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?}
      ALERT_WATCHDOG_PING: ${ALERT_WATCHDOG_PING:-}
    volumes:
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Links in notifications (scheme://host:port, no path, so the route prefix stays /).
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:?}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9093/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - observability-net

  # Files every alert as a task in Vikunja (VIKUNJA_URL, the relay's default
  # https://vikunja.asyla.org), off this host, in an ALERT_PROJECTS project (asyla=170, the first
  # entry and so the default; theOrg=169 for an alert whose alert_repo label's owner part is theOrg,
  # case-insensitive; a project Vikunja refuses falls back to 170 with a Routing note), and sends
  # the critical ones by email.
  # Since theOrg b5bd228 the relay has no Gitea sink and no Gitea fallback (theOrg DEPLOY.md,
  # "alert-relay on d06 (asyla)"). It reads every secret from OpenBao in-process
  # (alert-relay/relay.py): ALERT_RELAY_<SECRET>_KV is PATH#FIELD. A record it cannot read switches
  # that feature off, logged at start (the category, never a value). The Vikunja token is user
  # svc-alert-relay-d06's (theOrg ticketing provisions it; the record's last path segment names the
  # user, so the reconcile's own-task user, VIKUNJA_ALERT_USER, needs no setting); the delivery
  # ping URL is the delivery check's on healthchecks.io.
  # Holding that URL, the relay runs its Vikunja self-test at start and then daily (the token
  # reads project 170) and pings the check after each self-test and each delivery:
  # success, or the check's /fail, which takes it down and pages (theOrg alert-relay/relay.py
  # delivery_selftest, record_selftest). So the two go on together: the URL without a working
  # token pages at the first start. verify checks both (check_tokened, check_delivery).
  # Log lines: for an alert with a logql annotation the relay queries LOKI_QUERY_URL, here Loki
  # itself at loki:3100 inside observability-net (plain HTTP, auth_enabled false: no account, as
  # for vector-1 and Prometheus), and puts the newest lines in the task (relay.py log_section).
  # The relay fetches only with a query password as well, which it sends as Basic auth and Loki
  # ignores; it is asyla's own Loki account alert-relay (loki-clients.toml beside this file,
  # created by loki_accounts.py), which loki-gateway would check were the relay to query through
  # it. The chat-api record keeps theOrg's default, which this token cannot read ("refused"); chat-api is
  # off here (CHAT_API_URL empty).
  alert-relay:
    image: gitea.asyla.org/theorg/observability-alert-relay:${OBSERVABILITY_TAG:?}
    container_name: alert-relay-1
    ports:
      - "127.0.0.1:9111:9111"
    environment:
      OPENBAO_ADDR: ${OPENBAO_ADDR:?}
      OPENBAO_WRAPPED_TOKEN: ${ALERT_RELAY_OPENBAO_WRAPPED_TOKEN:-}
      ALERT_RELAY_VIKUNJA_KV: "secret/v2/vikunja/alert-tokens/svc-alert-relay-d06#value"
      ALERT_RELAY_SMTP_USERNAME_KV: "secret/hubs/asyla/smtp-relay-username#value"
      ALERT_RELAY_SMTP_PASSWORD_KV: "secret/hubs/asyla/smtp-relay-password#value"
      ALERT_RELAY_WATCHDOG_PING_KV: "secret/hubs/asyla/observability-watchdog-ping-url#value"
      ALERT_RELAY_DELIVERY_PING_KV: "secret/hubs/asyla/observability-delivery-ping-url#value"
      ALERT_RELAY_LOKI_KV: "secret/hubs/asyla/own/loki-clients/alert-relay#password"
      ALERT_PROJECTS: ${ALERT_PROJECTS:?}
      LOKI_QUERY_URL: "http://loki:3100"
      CHAT_API_URL: ""
      # Critical alerts by email: the recipient; the sender defaults to the SMTP username.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?}
      ALERT_EMAIL_SMARTHOST: "smtp.gmail.com:587"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9101/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - observability-net

  loki:
    image: gitea.asyla.org/theorg/observability-loki:${OBSERVABILITY_TAG:?}
    container_name: loki-1
    # Not published, and plain HTTP (theOrg's only configuration at f757911): Vector pushes and
    # Prometheus scrapes loki:3100 on observability-net. Nothing off this host reaches it but
    # through loki-gateway (below), with an account. The Prometheus job asks plain HTTP since #327
    # (prometheus/scrape-stack/loki.yml); at 64a2bf3 it asked https and d06 read up{job="loki"} 0
    # (2026-11-03).
    volumes:
      - loki-data:/loki
    # Unset here, so the configs' own defaults apply (744h, 0.05 MB/s, burst 16; DEPLOY.md).
    environment:
      - LOKI_RETENTION_PERIOD
      - LOKI_INGESTION_RATE_MB
      - LOKI_INGESTION_BURST_SIZE_MB
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-net

  # theOrg's loki-gateway (its docker-compose.yml at f678d8c) with d06's settings (option B, asyla
  # #1268): it lets each caller push or query Loki with its own account (loki-clients.toml), whose
  # password it reads from OpenBao at start with its own wrapped token, and forwards to loki:3100;
  # /ready is open and every other path is 404 (theOrg loki-gateway/gateway.go). TLS ends at d06's
  # Caddy as loki.asyla.org (Let's Encrypt), as for nats.asyla.org: no port is published, and
  # LOKI_GATEWAY_TLS off needs no step-ca, provisioner, loki-ca volume or extra_hosts (loadConfig
  # returns before them). Behind TLS, Caddy sends every caller's Basic-auth password to the gateway
  # in plain text. observability-net is shared by the whole stack, and caddy-internal-d06 and
  # communications' vector join it too, so any container there with NET_RAW could ARP-spoof that
  # hop. So Caddy reaches the gateway only on loki-edge (observability-loki-edge; historical name,
  # it carries all three gateways' hops), an internal network that only Caddy and the three
  # gateways join, by the alias loki-gateway-edge: the alias is on loki-edge alone, so the name
  # resolves to the gateway's loki-edge address and never to its observability-net one. Every
  # gateway there is scratch, read_only and cap_drop ALL (no NET_RAW), so none can spoof another's
  # hop. The gateway stays on observability-net for loki:3100 and OpenBao (loki-edge has no
  # egress). alert-relay and Vector stay on loki:3100 inside the stack. Not on a replica: it
  # reads production's OpenBao.
  loki-gateway:
    image: gitea.asyla.org/theorg/observability-loki-gateway:${OBSERVABILITY_TAG:?}
    container_name: loki-gateway-1
    environment:
      OPENBAO_ADDR: ${OPENBAO_ADDR:?}
      OPENBAO_WRAPPED_TOKEN: ${LOKI_GATEWAY_OPENBAO_WRAPPED_TOKEN:-}
      # name:scope,... in loki-clients.toml's order (observability.sh; a test checks they agree).
      LOKI_GATEWAY_ACCOUNTS: ${LOKI_GATEWAY_ACCOUNTS:?}
      LOKI_CLIENTS_KV_PREFIX: "secret/hubs/asyla/own/loki-clients"
      LOKI_GATEWAY_TLS: "off"
      LOKI_UPSTREAM: "http://loki:3100"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/loki-gateway", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      observability-net: {}
      loki-edge:
        aliases:
          - loki-gateway-edge

  # theOrg's loki-gateway image in LOKI_GATEWAY_MODE remote-write (theOrg DEPLOY.md, "Route
  # modes"; asyla #1268 item 3): POST /api/v1/write with a push account of
  # prometheus-write-clients.toml, forwarded to prometheus-ingest; /ready (forwarded to its
  # /-/ready) open; every other path 404, Prometheus's query, admin and federate paths included.
  # Settings as loki-gateway's, with its own token, accounts and prefix, so no password is shared
  # across modes. Caddy reaches it on loki-edge as prometheus-write-gateway-edge
  # (prometheus-write.asyla.org); it reaches prometheus-ingest on ingest, and OpenBao on
  # observability-net. Not on a replica: it reads production's OpenBao.
  # It starts once prometheus-ingest is healthy, and its healthcheck is loki-gateway's (theOrg's
  # `/loki-gateway healthcheck`, GET /ready, forwarded to prometheus-ingest's /-/ready).
  prometheus-write-gateway:
    image: gitea.asyla.org/theorg/observability-loki-gateway:${OBSERVABILITY_TAG:?}
    container_name: prometheus-write-gateway-1
    environment:
      OPENBAO_ADDR: ${OPENBAO_ADDR:?}
      OPENBAO_WRAPPED_TOKEN: ${PROMETHEUS_WRITE_GATEWAY_OPENBAO_WRAPPED_TOKEN:-}
      # name:scope,... in prometheus-write-clients.toml's order (observability.sh; a test checks).
      LOKI_GATEWAY_ACCOUNTS: ${PROMETHEUS_WRITE_GATEWAY_ACCOUNTS:?}
      LOKI_CLIENTS_KV_PREFIX: "secret/hubs/asyla/own/prometheus-write-clients"
      LOKI_GATEWAY_MODE: "remote-write"
      LOKI_GATEWAY_TLS: "off"
      LOKI_UPSTREAM: "http://prometheus-ingest:9090"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      prometheus-ingest:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/loki-gateway", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      observability-net: {}
      ingest: {}
      loki-edge:
        aliases:
          - prometheus-write-gateway-edge

  # theOrg's loki-gateway image in LOKI_GATEWAY_MODE pushgateway (theOrg DEPLOY.md, "Route modes";
  # asyla #1268 item 4): PUT, POST and DELETE on /metrics/job/<job>[/<label>/<value> ...] with a
  # push account of pushgateway-clients.toml, forwarded to pushgateway:9091; a path holding %2F is
  # 404 (send a slash in the @base64 form); /ready open; every other path 404, the pushgateway's
  # /metrics and its /api/v1 status and wipe paths included. Settings as loki-gateway's, with its
  # own token, accounts and prefix. Caddy reaches it on loki-edge as pushgateway-gateway-edge
  # (pushgateway.asyla.org); it reaches the pushgateway on push, and OpenBao on observability-net.
  # Not on a replica: it reads production's OpenBao.
  pushgateway-gateway:
    image: gitea.asyla.org/theorg/observability-loki-gateway:${OBSERVABILITY_TAG:?}
    container_name: pushgateway-gateway-1
    environment:
      OPENBAO_ADDR: ${OPENBAO_ADDR:?}
      OPENBAO_WRAPPED_TOKEN: ${PUSHGATEWAY_GATEWAY_OPENBAO_WRAPPED_TOKEN:-}
      # name:scope,... in pushgateway-clients.toml's order (observability.sh; a test checks).
      LOKI_GATEWAY_ACCOUNTS: ${PUSHGATEWAY_GATEWAY_ACCOUNTS:?}
      LOKI_CLIENTS_KV_PREFIX: "secret/hubs/asyla/own/pushgateway-clients"
      LOKI_GATEWAY_MODE: "pushgateway"
      LOKI_GATEWAY_TLS: "off"
      LOKI_UPSTREAM: "http://pushgateway:9091"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      pushgateway:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/loki-gateway", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      observability-net: {}
      push: {}
      loki-edge:
        aliases:
          - pushgateway-gateway-edge

  prometheus:
    image: gitea.asyla.org/theorg/observability-prometheus:${OBSERVABILITY_TAG:?}
    container_name: prometheus-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    # prometheus-entrypoint.sh enables the two pieces' scrape jobs (folded in from theOrg's
    # compose.docker-socket.yml and compose.blackbox.yml). MONITOR_THEORG stays unset (theorg
    # #1269), so no job here reads a token and theOrg's rules are not loaded.
    # theOrg's compose.ingest.yml at 04f31709 sets the four below. FEDERATE_INGEST=true works with
    # MONITOR_THEORG off: the entrypoint writes ingest-federate (/federate on
    # FEDERATE_INGEST_HOST:FEDERATE_INGEST_PORT, one match[] per job name in its scrape-theorg/,
    # honor_labels, track_timestamps_staleness) whatever MONITOR_THEORG says, so the Mini's series
    # are here, with no rule on them until #1269. THEORG_SCRAPE=false changes nothing while
    # MONITOR_THEORG is off (it is read only inside that switch), and is set now because with
    # MONITOR_THEORG on and FEDERATE_INGEST on the entrypoint exits 2 unless it is false.
    environment:
      SCRAPE_DOCKER_STATE_EXPORTER: "true"
      SCRAPE_BLACKBOX_EXPORTER: "true"
      FEDERATE_INGEST: "true"
      THEORG_SCRAPE: "false"
      FEDERATE_INGEST_HOST: "prometheus-ingest"
      FEDERATE_INGEST_PORT: "9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}
      - --web.external-url=${PROMETHEUS_EXTERNAL_URL:?}
    # asyla's own rules and scrape jobs (asyla #610 step 5: the asyla-hw job and its alerts), on
    # theOrg's deployer hooks (DEPLOY.md at 04f3170: /etc/prometheus/rules and /etc/prometheus/scrape,
    # read-only, read beside the stack's own). Only *.yml rule files go in prometheus/rules; their
    # promtool tests are in prometheus/tests (README.md, "Hardware alerts").
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/scrape:/etc/prometheus/scrape:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Its own receiver stays off (in operations mode the entrypoint exits 2 on
    # --web.enable-remote-write-receiver). It joins ingest to read prometheus-ingest by federation
    # (ingest-federate), and push to scrape the pushgateway (theOrg's pushgateway job, by service
    # name).
    networks:
      - observability-net
      - ingest
      - push

  # Long-term capacity and trend data; size retention only (24 GiB, sized for this 64 GiB disk).
  # Its baked-in jobs include asyla's Home Assistant (through scrape-proxy:9119, no token file)
  # and emporia-collector's own (emporia-collector:9108).
  prometheus-trends:
    image: gitea.asyla.org/theorg/observability-prometheus-trends:${OBSERVABILITY_TAG:?}
    container_name: prometheus-trends-1
    ports:
      - "127.0.0.1:9107:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.size=${TRENDS_RETENTION_SIZE:-24GB}
      # emporia-collector writes here. The receiver answers on the same port as queries, so
      # anything that reaches 9107 can write: trend data only.
      - --web.enable-remote-write-receiver
    volumes:
      - prometheus-trends-data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-net

  # The ingest Prometheus (theOrg DEPLOY.md, "Where the writes go"; asyla #1268 item 3): the
  # remote-write receiver behind prometheus-write-gateway. Prometheus serves writes and queries on
  # one listener, so with the receiver on anything that reaches it can write: its only network is
  # ingest, joined by the gateway and the operations Prometheus alone; no port, not on
  # observability-net.
  # theOrg's compose.ingest.yml at 04f31709: the operations Prometheus image in its ingest mode
  # (PROMETHEUS_MODE=ingest, prometheus-entrypoint.sh): /etc/prometheus/ingest.yml, globals only,
  # no scrape job and no rule whatever the other switches say; the entrypoint refuses ingest mode
  # unless the command names that file and the receiver. Retention 1 day, at most 2 GB, whichever
  # first: federation reads only each series' newest sample, so this is a buffer, not history (the
  # operations Prometheus keeps that). Its data is a bind volume under OBSERVABILITY_ROOT like the
  # other Prometheus data (theOrg's is a plain named volume), not backed up. It reads nothing off
  # this host (no OpenBao, no token, no socket), so it runs on a replica too, where the operations
  # Prometheus's ingest-federate reads it (empty: a replica has no remote-write gateway).
  prometheus-ingest:
    image: gitea.asyla.org/theorg/observability-prometheus:${OBSERVABILITY_TAG:?}
    container_name: prometheus-ingest-1
    environment:
      PROMETHEUS_MODE: ingest
    command:
      - --config.file=/etc/prometheus/ingest.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${INGEST_RETENTION_TIME:-1d}
      - --storage.tsdb.retention.size=${INGEST_RETENTION_SIZE:-2GB}
      - --web.enable-remote-write-receiver
    volumes:
      - prometheus-ingest-data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ingest

  # Emporia Vue minute data into prometheus-trends by remote write, backfilling what Emporia still
  # holds (emporia-collector/collector.py). Its own /metrics (9108) is not published. The Emporia
  # login is read from OpenBao in-process: *_KV is a plain path, the field EMPORIA_KV_FIELD
  # (default value). With no token at all it exits, so it starts only with its token.
  emporia-collector:
    image: gitea.asyla.org/theorg/observability-emporia-collector:${OBSERVABILITY_TAG:?}
    container_name: emporia-collector-1
    depends_on:
      prometheus-trends:
        condition: service_healthy
    environment:
      TRENDS_URL: http://prometheus-trends:9090
      OPENBAO_ADDR: ${OPENBAO_ADDR:?}
      OPENBAO_WRAPPED_TOKEN: ${EMPORIA_OPENBAO_WRAPPED_TOKEN:-}
      EMPORIA_USERNAME_KV: secret/hubs/asyla/emporia-username
      EMPORIA_PASSWORD_KV: secret/hubs/asyla/emporia-password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/metrics', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - observability-net

  # The trends Prometheus scrapes Home Assistant through this (/scrape/home-assistant), so no token
  # is in a file (scrape-proxy/proxy.py). It reads the token from OpenBao in-process:
  # HOME_ASSISTANT_TOKEN_KV is a plain path, the field HOME_ASSISTANT_TOKEN_FIELD (default value).
  # Port 9119 is not published: only observability-net reaches it.
  scrape-proxy:
    image: gitea.asyla.org/theorg/observability-scrape-proxy:${OBSERVABILITY_TAG:?}
    container_name: scrape-proxy-1
    environment:
      OPENBAO_WRAPPED_TOKEN: ${SCRAPE_PROXY_OPENBAO_WRAPPED_TOKEN:-}
      OPENBAO_ADDR: ${OPENBAO_ADDR:?}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:?}
      HOME_ASSISTANT_TOKEN_KV: secret/hubs/asyla/home-assistant-prometheus-token
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - observability-net

  # With the Docker socket (folded in from compose.docker-socket.yml): this stack's own logs to Loki
  # over plain HTTP inside observability-net (theOrg vector-docker-logs.toml at f757911 has no tls
  # block and names no CA file), and its CHRONICLE_EPISODE lines to memory-system's Vector
  # (CHRONICLE_VECTOR_ADDRESS). observability.sh verify reads the lines back from loki:3100.
  # The socket bind matches theOrg's compose.docker-socket.yml. Its :ro does not make the Docker
  # API read-only: whatever connects to the socket has the whole API. Vector's only inputs are
  # internal_metrics and docker_logs limited to compose project observability (theOrg vector.toml,
  # vector-docker-logs.toml). A socket proxy would be theOrg's change.
  vector:
    image: gitea.asyla.org/theorg/observability-vector:${OBSERVABILITY_TAG:?}
    container_name: vector-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9598:9598"
    depends_on:
      loki:
        condition: service_healthy
    user: root
    volumes:
      - vector-disk-buffer:/var/lib/vector
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      VECTOR_LOG: info
      LOKI_ADDRESS: loki:3100
      CHRONICLE_VECTOR_ADDRESS: ${CHRONICLE_VECTOR_ADDRESS:?}
      # vector-entrypoint.sh loads vector-docker-logs.toml when this is true. On since 64a2bf3; it
      # was off on d06 at 7572365 (that sink named /etc/loki-ca/root_ca.crt; Vector refused to
      # start).
      VECTOR_DOCKER_LOGS: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9598/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - observability-net

  # Container lifecycle metrics for every container on this daemon (theOrg's
  # compose.docker-socket.yml, folded in; published on 127.0.0.1 only). Its socket bind is theOrg's
  # too: the :ro does not make the Docker API read-only (as for vector, above).
  docker-state-exporter:
    image: gitea.asyla.org/theorg/observability-docker-state-exporter:${OBSERVABILITY_TAG:?}
    container_name: docker-state-exporter-1
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9099/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - observability-net

  # Probes (theOrg's compose.blackbox.yml, folded in). Not published: anything that reaches /probe
  # can make it connect anywhere this host can. Prometheus's blackbox-selftest job probes
  # Prometheus itself over HTTP, TCP and ICMP (observability.sh verify reads the three).
  blackbox-exporter:
    image: gitea.asyla.org/theorg/observability-blackbox-exporter:${OBSERVABILITY_TAG:?}
    container_name: blackbox-exporter-1
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9115/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - observability-net

volumes:
  # Data, on d06's local data disk (observability.sh creates and owns the directories).
  alertmanager-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${OBSERVABILITY_ROOT:?}/alertmanager-data" }
  loki-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${OBSERVABILITY_ROOT:?}/loki-data" }
  prometheus-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${OBSERVABILITY_ROOT:?}/prometheus-data" }
  prometheus-trends-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${OBSERVABILITY_ROOT:?}/prometheus-trends-data" }
  prometheus-ingest-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${OBSERVABILITY_ROOT:?}/prometheus-ingest-data" }
  vector-disk-buffer:
    name: observability-vector-disk-buffer

networks:
  observability-net:
    driver: bridge
  # The three networks below are external, so compose neither makes nor removes them:
  # observability.sh (ensure_networks) creates each before every `up`, with or without any
  # gateway's token and on a replica too, as an internal bridge (no egress), and refuses one that
  # is not internal. `down` leaves them. A network made outside compose is used as it is, so
  # internal is checked there.
  # Caddy to the three gateways only (loki-gateway, above): Caddy forwards callers' passwords in
  # plain text on it. External as in internal-access hosts/d06, whose networks.txt makes it the
  # same way, so either stack may start first. The name is historical (it was loki-gateway's alone,
  # asyla #1268 items 1-2): it carries all three gateways' hops, and is kept so the deployed
  # network and internal-access's need no rename.
  loki-edge:
    name: observability-loki-edge
    external: true
  # prometheus-write-gateway and the operations Prometheus to prometheus-ingest, whose receiver
  # takes a write from anything here.
  ingest:
    name: observability-ingest
    external: true
  # pushgateway-gateway and the operations Prometheus to the pushgateway, which takes a push from
  # anything here.
  push:
    name: observability-push
    external: true
