# theOrg's observability stack on d06: Loki and its gateway, Prometheus, the trends Prometheus,
# Alertmanager, alert-relay, the pushgateway, Vector, docker-state-exporter and blackbox-exporter.
# Written by asyla from theOrg observability docker-compose.yml, compose.docker-socket.yml and
# compose.blackbox.yml at main 2144f83c3ec978663d3cb544e743ae8006471a0a (DEPLOY.md at that sha).
# Project, container names, volume names and the network are theOrg's. asyla's choices:
# - the Docker-socket and blackbox pieces are folded in; credential-probe, the Ollama log and
#   MONITOR_THEORG (theOrg's other stacks' jobs and rules) are not here;
# - no build sections: theOrg's published images of OBSERVABILITY_TAG (observability.sh pins it);
# - only the gateway (3100) is published on every address; every other port on 127.0.0.1 only
#   (Alertmanager on 9093, the pushgateway on 9091, docker-state-exporter on 9099);
# - Loki, both Prometheus and Alertmanager keep their data on d06's local data disk, as named
#   volumes bound to OBSERVABILITY_ROOT (theOrg decision asyla-network-monitoring §8: never NFS);
# - no secret is in any file or volume, on disk or in memory (asyla SEC-5 and SEC-7; the operator,
#   2026-11-03: secrets live only in OpenBao, and the stack is fixed to read them from there).
#
# Off until theOrg's stack reads its secrets from OpenBao itself (README.md says which change
# turns each on). Each is off here and nowhere else:
#   email receiver        Alertmanager gets no mail login, so alertmanager-entrypoint.sh leaves
#                         its email piece off; every alert still goes to alert-relay
#   Watchdog ping         Alertmanager gets no ping address: its watchdog piece is off
#   delivery ping         alert-relay gets no ping address: its delivery ping is off
#   trends HA job         trends-scrape-off.yml replaces the job's scrape file in prometheus-trends
#   emporia-collector     not a service here; trends-scrape-off.yml replaces its scrape file too
#   Loki TLS              no leaf: Loki serves HTTP inside observability-net, the gateway HTTP
#   Loki gateway accounts no verifier files: the gateway fails closed, refusing every push and
#                         query (401 or 403), and serves /ready alone; alert-relay's log lines are off
#
# Run with observability.sh: it sets OBSERVABILITY_TAG, OBSERVABILITY_ROOT and the settings below
# and keeps the start order.
name: observability

services:
  pushgateway:
    image: prom/pushgateway:v1.11.1
    container_name: pushgateway-1
    ports:
      - "127.0.0.1:9091:9091"
    restart: unless-stopped
    networks:
      - observability-net

  # Every alert goes to alert-relay (the base configuration); the optional pieces are off (above).
  alertmanager:
    image: gitea.asyla.org/theorg/observability-alertmanager:${OBSERVABILITY_TAG:?}
    container_name: alertmanager-1
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Links in notifications (scheme://host:port, no path, so the route prefix stays /).
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:?}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9093/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - observability-net

  # Files every alert as an issue in GITEA_ALERT_REPO (asyla/alerts) on the forge, off this host.
  # It files nothing until theOrg's secrets-alert-relay change: the relay then logs in to OpenBao
  # itself with a single-use wrapped token, so no secret sits in its environment (README.md).
  # relay.py serves without a token.
  alert-relay:
    image: gitea.asyla.org/theorg/observability-alert-relay:${OBSERVABILITY_TAG:?}
    container_name: alert-relay-1
    ports:
      - "127.0.0.1:9111:9111"
    environment:
      GITEA_URL: ${GITEA_URL:?}
      GITEA_ALERT_REPO: ${GITEA_ALERT_REPO:?}
      ALERT_REPOS: ${ALERT_REPOS:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9101/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - observability-net

  loki:
    image: gitea.asyla.org/theorg/observability-loki:${OBSERVABILITY_TAG:?}
    container_name: loki-1
    # Not published: callers off the stack reach Loki through loki-gateway. HTTP: no leaf is
    # mounted, so loki-entrypoint.sh picks the HTTP configuration.
    volumes:
      - loki-data:/loki
    # Unset here, so the configs' own defaults apply (744h, 0.05 MB/s, burst 16; DEPLOY.md).
    environment:
      - LOKI_RETENTION_PERIOD
      - LOKI_INGESTION_RATE_MB
      - LOKI_INGESTION_BURST_SIZE_MB
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-net

  # Loki's authenticating reverse proxy. With no leaf it serves HTTP (its entrypoint.sh); with no
  # verifier files it refuses every push and query (locations.conf: a caller without an account
  # gets 401 or 403) and answers /ready alone.
  loki-gateway:
    image: gitea.asyla.org/theorg/observability-loki-gateway:${OBSERVABILITY_TAG:?}
    container_name: loki-gateway-1
    ports:
      - "3100:3100"
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3100/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-net

  prometheus:
    image: gitea.asyla.org/theorg/observability-prometheus:${OBSERVABILITY_TAG:?}
    container_name: prometheus-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    # prometheus-entrypoint.sh enables the two pieces' scrape jobs (folded in from theOrg's
    # compose.docker-socket.yml and compose.blackbox.yml). MONITOR_THEORG stays unset, so no job
    # here reads a token.
    environment:
      SCRAPE_DOCKER_STATE_EXPORTER: "true"
      SCRAPE_BLACKBOX_EXPORTER: "true"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}
      - --web.external-url=${PROMETHEUS_EXTERNAL_URL:?}
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-net

  # Long-term capacity and trend data; size retention only (24 GiB, sized for this 64 GiB disk).
  prometheus-trends:
    image: gitea.asyla.org/theorg/observability-prometheus-trends:${OBSERVABILITY_TAG:?}
    container_name: prometheus-trends-1
    ports:
      - "127.0.0.1:9107:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.size=${TRENDS_RETENTION_SIZE:-24GB}
      - --web.enable-remote-write-receiver
    volumes:
      - prometheus-trends-data:/prometheus
      # Two baked-in jobs off (header): the Home Assistant job and emporia-collector's own.
      - ./trends-scrape-off.yml:/etc/prometheus/scrape/asyla-home-assistant.yml:ro
      - ./trends-scrape-off.yml:/etc/prometheus/scrape/emporia.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-net

  # With the Docker socket (folded in): this stack's own logs to Loki over HTTP inside
  # observability-net (no CA is mounted, so vector-entrypoint.sh picks http), and its
  # CHRONICLE_EPISODE lines to memory-system's Vector (CHRONICLE_VECTOR_ADDRESS).
  vector:
    image: gitea.asyla.org/theorg/observability-vector:${OBSERVABILITY_TAG:?}
    container_name: vector-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9598:9598"
    depends_on:
      loki:
        condition: service_healthy
    user: root
    volumes:
      - vector-disk-buffer:/var/lib/vector
    environment:
      VECTOR_LOG: info
      LOKI_ADDRESS: loki:3100
      CHRONICLE_VECTOR_ADDRESS: ${CHRONICLE_VECTOR_ADDRESS:?}
      # Off on d06 for now: at 2144f83 vector-docker-logs.toml names /etc/loki-ca/root_ca.crt in its
      # Loki sink's tls block, and Vector 0.40 refuses to start when that file is absent (measured on
      # d06 2026-11-03: "Could not open certificate file"), though vector.toml's header says the sink
      # falls back to HTTP. d06 runs Loki on HTTP with no root until theOrg's secrets-loki-tls
      # change, so the pipeline (this stack's own logs to Loki) waits for that. docker-state-exporter
      # (container state metrics and alerts) is unaffected.
      VECTOR_DOCKER_LOGS: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9598/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - observability-net

  # Container lifecycle metrics for every container on this daemon (theOrg's
  # compose.docker-socket.yml, folded in; published on 127.0.0.1 only).
  docker-state-exporter:
    image: gitea.asyla.org/theorg/observability-docker-state-exporter:${OBSERVABILITY_TAG:?}
    container_name: docker-state-exporter-1
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9099/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - observability-net

  # Probes (theOrg's compose.blackbox.yml, folded in). Not published: anything that reaches /probe
  # can make it connect anywhere this host can. Prometheus's blackbox-selftest job probes
  # Prometheus itself over HTTP, TCP and ICMP (observability.sh verify reads the three).
  blackbox-exporter:
    image: gitea.asyla.org/theorg/observability-blackbox-exporter:${OBSERVABILITY_TAG:?}
    container_name: blackbox-exporter-1
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9115/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - observability-net

volumes:
  # Data, on d06's local data disk (observability.sh creates and owns the directories).
  alertmanager-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${OBSERVABILITY_ROOT:?}/alertmanager-data" }
  loki-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${OBSERVABILITY_ROOT:?}/loki-data" }
  prometheus-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${OBSERVABILITY_ROOT:?}/prometheus-data" }
  prometheus-trends-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${OBSERVABILITY_ROOT:?}/prometheus-trends-data" }
  vector-disk-buffer:
    name: observability-vector-disk-buffer

networks:
  observability-net:
    driver: bridge
