# d04: theOrg's forge host, Gitea and its registry only (asyla hub decisions/host-layout.md).
# NOT COMPLETE: what is left of the build test host, whose role moved to test01 on 2026-10-13.
# The production spec ([vm] on vmh01, Gitea's app and secrets, its proxy and tunnel, the runner's
# labels) comes with step 3 of that decision, proven on test01 first. Until then `hold` makes
# build_host.py refuse to build it. d04 is not disposable: a build or a destroy needs
# --confirm d04 and the operator's approval of the exact action.
hold = "the production spec is not written yet (asyla hub decisions/host-layout.md, Consequences 3)"

[vm]
node = "vmh02"
vmid = 104
sockets = 1
cores = 4
memory_mb = 8192
ip = "10.0.0.63/24"
os_disk = { storage = "local-data2", size = "32G" }
data_disk = { storage = "local-data2", size = "16G" }   # /mnt/docker
cloudinit_storage = "local-data2"

[setup]
steps = ["systemConfig.sh", "nfs.sh", "docker.sh"]

[runner]
enabled = false
