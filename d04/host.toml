# d04 build spec, read by scripts/build_host.py: theOrg's forge host, Gitea and its container
# registry only (asyla hub decisions/host-layout.md). Gitea moves here from d03 at the cutover;
# until then d03 serves gitea.asyla.org, and d04's copy of gitea.sh refuses `backup` (the name
# does not resolve to d04) so it never writes over d03's NAS mirror. d04 is not disposable: a
# build or a destroy needs --confirm d04 and the operator's approval of the exact action.
# Proven on test01 first (test01 as [replica] of = "d04").

# Operator's values, 2026-10-15. order=10: before d03 (order=15) when vmh01 boots.
[vm]
node = "vmh01"
vmid = 104
sockets = 1
cores = 4
memory_mb = 8192
ip = "10.0.0.63/24"
os_disk = { storage = "local-data1", size = "32G" }
data_disk = { storage = "local-data1", size = "128G" }   # /mnt/docker: Gitea's data and registry
cloudinit_storage = "local-data2"                       # as d03 on vmh01
startup = "order=10"                                    # set at create, checked by verify

[setup]
steps = ["systemConfig.sh", "nfs.sh", "docker.sh", "bashrc.sh"]   # build/setup/, sent by the build

# The proxy's and the tunnel's, as d03's. Gitea's own secrets are inside its restored data (app.ini).
[[secret]]
var = "D04_CLOUDFLARED_ENV"
path = "/mnt/docker/cloudflared/.env"
owner = "docker:docker"
mode = "600"
[[secret]]
var = "D04_INTERNAL_PROXY_ENV"
path = "/mnt/docker/internal-proxy/.env"
owner = "docker:docker"
mode = "600"

# Restored from $DOCKER_D1/Gitea/mirror, d03's backup. Built twice (asyla hub
# decisions/host-layout.md, Consequences 4 and 5): first as the DR test, from d03's last nightly,
# with no name pointing at d04; then at the cutover with --recreate, after d03's Gitea is stopped
# and its final backup is taken, so d04 starts from the latest copy.
[[app]]
name = "gitea"
verify = ["verify"]   # d04's copy: a local :3000 healthz failure fails verify

[[external]]
name = "internal-access"
repo = "~/local/asyla/projects/internal-access"
run = ["scripts/deploy-host.sh {host}", "scripts/fleet.sh --host {host} restore up verify"]
[[external]]
name = "external-access"
repo = "~/local/asyla/projects/external-access"
run = ["scripts/deploy-host.sh {host}", "scripts/fleet.sh --host {host} up verify"]

# Off until the cutover (operator, 2026-10-15): while GITEA_TOKEN_HOST is "d03", a runner
# registered here would join d03's live Gitea and could take theorg/prod jobs. At the cutover
# GITEA_TOKEN_HOST becomes "d04" and this becomes true.
[runner]
enabled = false
labels = ["theorg", "prod", "d04"]   # docker/gitea-runner/gitea-runner.sh reads them from here
