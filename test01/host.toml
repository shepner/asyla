# test01: the build test host (asyla hub decisions/host-layout.md, decision 4). Created and
# destroyed as testing needs (operator pre-approved for test01 only, 2026-10-13).
# The #1247/#1248 proof (asyla #602 G3, G4): test01 built as a d01 replica, as the d01 proof of
# 2026-10-18 was (1baa08c), restoring media, calibre and duplicati from d01's ordinary nightly NAS
# mirrors (taken with the apps running) and starting them with no way to write outward
# (scripts/build_host.py docstring, Replica). #1247: d01's [[external]] where-to-stream has
# replica = true, so the build pushes where-to-stream's source to test01 and verify checks it.
# #1248: each app runs, then PRAGMA integrity_check on copies of seerr's and calibre's databases.
# No [runner], [gitlab_runner], [host_maintenance] or [[external]] of its own: a replica reaches
# nothing off the LAN and must not answer for d01's names. No smb.sh: the NAS media share is d01's
# own mount, and smb.sh refuses a replica. No d01 secret: none of the three apps takes one.
# This commit is reverted after the proof, which brings back the hello test.
[vm]
node = "vmh01"             # the default; either node may carry it: build_host.py test01 build --node vmh02
vmid = 901                 # a block of its own, away from the Docker hosts (101 up)
sockets = 1
cores = 8                  # as d01 (d01/host.toml)
memory_mb = 16384          # as d01
ip = "10.0.0.69/24"
os_disk = { storage = "local-data2", size = "64G" }     # as d01; local-data2 exists on both nodes
data_disk = { storage = "local-data2", size = "64G" }   # /mnt/docker: as d01 (Duplicati about 22G)
cloudinit_storage = "local-data2"
disposable = true          # build_host.py may destroy and recreate it without --confirm
startup = "order=90"       # after every production VM when a node boots; set at create, checked by verify

[setup]
steps = ["systemConfig.sh", "nfs.sh", "docker.sh", "container_dns.sh", "bashrc.sh"]   # build/setup/: d01's, without smb.sh and node_exporter.sh

# Only three of d01's apps run on the replica (as 1baa08c):
# - homebridge advertises a HomeKit bridge on the LAN, so a second one would clash with d01's;
# - home-assistant would act on the LAN's devices as d01's does;
# - cloudflared would join d01's tunnel and take its traffic;
# - breeding-program loads every kennel from BigQuery when it starts, and its build needs the
#   internet; the replica's egress block stops both.
# No verify list: none of the three publishes a web port (d01's where-to-stream check asks /healthz
# inside its container).
[replica]
of = "d01"
start_apps = true
apps = ["media", "calibre", "duplicati"]
exclude_secrets = ["D01_SMBCREDENTIALS", "D01_BREEDING_PROGRAM_APP_ENV", "D01_CLOUDFLARED_ENV", "D01_INTERNAL_PROXY_ENV"]
