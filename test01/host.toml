# test01: the build test host (asyla hub decisions/host-layout.md, decision 4). Created and
# destroyed as testing needs (operator pre-approved for test01 only, 2026-10-13).
# The d06 verified restore (asyla backlog 2026-10-17-hosts-d06-build-it-and-move-theorg-s-ticketing-
# vikunja-onto-it-the): test01 as a d06 replica restoring ticketing from d06's NAS mirror
# ($DOCKER_D1/Ticketing/mirror, mounted read-only on a replica; no seed, so ticketing.sh restore
# reads the mirror) and starting Vikunja only (compose.yml: no vault, no vikunja-mcp sign-in;
# operator 2026-10-18: "thats fine"). No [runner],
# [gitlab_runner] or [[external]]: a replica reaches nothing off the LAN and must not answer for
# d06's names. This commit is reverted after the proof, which brings back the hello test.
[vm]
node = "vmh01"             # the default; either node may carry it: build_host.py test01 build --node vmh02
vmid = 901                 # a block of its own, away from the Docker hosts (101 up)
sockets = 1
cores = 8                  # as d06 (d06/host.toml)
memory_mb = 16384          # as d06
ip = "10.0.0.69/24"
os_disk = { storage = "local-data2", size = "64G" }     # as d06; local-data2 exists on both nodes
data_disk = { storage = "local-data2", size = "64G" }   # /mnt/docker: as d06
cloudinit_storage = "local-data2"
disposable = true          # build_host.py may destroy and recreate it without --confirm
startup = "order=90"       # after every production VM when a node boots; set at create, checked by verify

[setup]
steps = ["systemConfig.sh", "nfs.sh", "docker.sh", "bashrc.sh"]   # build/setup/, sent by the build

# host-maintenance's key set (gap G11; build/setup/host_maintenance_keys.sh, setup phase). The
# key is a throwaway one, made for a test01 build and deleted after it (asyla backlog, G11 proof):
# it authorizes docker@test01 only, never d01 to d03. The pins are d01 to d03's ed25519 host keys
# (ssh-keyscan -t ed25519 from the workstation, 2026-10-15, equal to its known_hosts); the build
# scans each address from test01 and fails on another key. self_address: test01's own new host
# key, read on test01 by the setup phase, as the rebuilt d03 pins its own (d03/host.toml).
[[secret]]
var = "TEST01_HOST_MAINTENANCE_SSH_KEY"
path = "/home/docker/.config/host-maintenance/ssh/id_ed25519"
owner = "docker:docker"
mode = "600"

[host_maintenance]
identity = "/home/docker/.config/host-maintenance/ssh/id_ed25519"
user = "docker"
known_hosts = [
  "10.0.0.60 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDklyJ5JfOrunGhBVq3B00PFofICXisn2NryUP5yvA5D",
  "10.0.0.61 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPbeDGfZcftzPaZaKINRYpCqTWWPB8e5rgJQsoEVBvz8",
  # 10.0.0.62: the rebuilt d03 (VM 113, cutover 2026-10-17); VM 103's key was ...bhhGgU9S.
  "10.0.0.62 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEWBYkIF2Vt24oPKu01VJPEExr3WzbsWyMjahtuYpaak",
]
self_address = "10.0.0.69"

# The replica takes d06's ticketing app. d06 has no [[secret]], so nothing is excluded; its proxy
# is an [[external]], which a replica never runs. The pull token comes at use from OpenBao
# ([[app]] pull_token_env, over SSH stdin); its start_env (the Dex pair) never goes to a replica.
# Vikunja listens on 127.0.0.1:3456 only (compose.yml), so verify runs on the host.
[replica]
of = "d06"
start_apps = true
apps = ["ticketing"]
verify = ["http://127.0.0.1:3456/api/v1/info"]
