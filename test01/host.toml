# test01: the build test host (asyla hub decisions/host-layout.md, decision 4). Created and
# destroyed as testing needs (operator pre-approved for test01 only, 2026-10-13).
# The #1101 proof (asyla #1101; d05/apps/identity-platform/README.md, "Rebuild from the nas01 mirror
# (#1101)"): test01 built as a replica of d05 with identity-platform only, so that
# scripts/tests/test_identity_platform_mirror_restore_test01.sh (header steps 1-4) runs
# restore-mirror and mirror-check on a disposable host. The operator allowed production identity data
# on test01 for this proof, with test01 destroyed afterwards ("Yes, then destroy", 2026-11-21); the
# wrapper destroys it, pass or fail. The NAS is mounted read-only (build/setup/nfs.sh) and egress is
# blocked; d05 has no [[secret]] and a replica gets no start_env, so test01 gets no secret.
# No [[secret]], [host_maintenance], [runner], [gitlab_runner] or [[external]]: a replica reaches
# nothing off the LAN and must not answer for d05's names.
# This commit is reverted after the proof, which brings back the hello test.
[vm]
node = "vmh01"             # the default; either node may carry it: build_host.py test01 build --node vmh02
vmid = 901                 # a block of its own, away from the Docker hosts (101 up)
sockets = 1
cores = 4
memory_mb = 8192
ip = "10.0.0.69/24"
os_disk = { storage = "local-data2", size = "32G" }     # local-data2 exists on both nodes
data_disk = { storage = "local-data2", size = "16G" }   # /mnt/docker
cloudinit_storage = "local-data2"
disposable = true          # build_host.py may destroy and recreate it without --confirm
startup = "order=90"       # after every production VM when a node boots; set at create, checked by verify

[setup]
steps = ["systemConfig.sh", "nfs.sh", "docker.sh", "container_dns.sh", "bashrc.sh", "node_exporter.sh"]   # build/setup/: d05's steps

# Node exporter as on d05 (build/setup/node_exporter.sh); nothing scrapes test01.
[node_exporter]
allow = ["10.0.0.0/24"]    # as d05

# identity-platform from ~/scripts/d05 (restore = false in d05's spec). Its `up` on a replica
# starts keycloak-db alone with a throwaway password made at run time; openldap and keycloak never
# start (d05/apps/identity-platform/README.md, Replica).
[replica]
of = "d05"
start_apps = true
apps = ["identity-platform"]
