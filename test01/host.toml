# test01: the build test host (asyla hub decisions/host-layout.md, decision 4). Created and
# destroyed as testing needs (operator pre-approved for test01 only, 2026-10-13).
# The d01 proof (asyla backlog 2026-10-17-hosts-d01-replace-with-a-new-vm-built-by-build-host-py):
# test01 built the way the new d01 would be, as a d01 replica of the new d01 spec (build/setup/, not
# d01/setup/), restoring media, calibre and duplicati from d01's NAS mirrors and starting them, with
# no way to write outward (scripts/build_host.py docstring, Replica). No [runner], [gitlab_runner]
# or [[external]]: a replica reaches nothing off the LAN and must not answer for d01's names. No
# smb.sh: the NAS media share is d01's own mount, and smb.sh refuses a replica. This commit is
# reverted after the proof, which brings back the hello test.
[vm]
node = "vmh01"             # the default; either node may carry it: build_host.py test01 build --node vmh02
vmid = 901                 # a block of its own, away from the Docker hosts (101 up)
sockets = 1
cores = 8                  # as the new d01 (d01/host.toml)
memory_mb = 16384          # as the new d01
ip = "10.0.0.69/24"
os_disk = { storage = "local-data2", size = "64G" }     # as the new d01; local-data2 exists on both nodes
data_disk = { storage = "local-data2", size = "64G" }   # /mnt/docker: as the new d01
cloudinit_storage = "local-data2"
disposable = true          # build_host.py may destroy and recreate it without --confirm
startup = "order=90"       # after every production VM when a node boots; set at create, checked by verify

[setup]
steps = ["systemConfig.sh", "nfs.sh", "docker.sh", "bashrc.sh"]   # build/setup/, sent by the build; no smb.sh

# host-maintenance's key set, test01's own (the replica keeps it; d01 has no [host_maintenance] of
# its own to take), with its own throwaway key TEST01_HOST_MAINTENANCE_SSH_KEY: build/setup/
# host_maintenance_keys.sh reads test01/host.toml alone, so the identity must be one of test01's own
# [[secret]]s. self_address is test01's own address, never d01's.
[[secret]]
var = "TEST01_HOST_MAINTENANCE_SSH_KEY"
path = "/home/docker/.config/host-maintenance/ssh/id_ed25519"
owner = "docker:docker"
mode = "600"

[host_maintenance]
identity = "/home/docker/.config/host-maintenance/ssh/id_ed25519"
user = "docker"
known_hosts = [
  "10.0.0.60 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEWInJu/I6E2DxkusPBWL2c4gY4OBKVyvhuYz4VOfkrv",
  "10.0.0.61 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPbeDGfZcftzPaZaKINRYpCqTWWPB8e5rgJQsoEVBvz8",
  # 10.0.0.62: the rebuilt d03 (VM 113, cutover 2026-10-17); VM 103's key was ...bhhGgU9S.
  "10.0.0.62 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEWBYkIF2Vt24oPKu01VJPEExr3WzbsWyMjahtuYpaak",
]
self_address = "10.0.0.69"

# Only three of d01's six apps run on the replica; the proof restores and builds the other three by
# hand (asyla backlog item above, "Next, in order", step 4):
# - homebridge advertises a HomeKit bridge on the LAN, so a second one would clash with d01's;
# - cloudflared would join d01's tunnel and take its traffic, so D01_CLOUDFLARED_ENV is excluded;
# - breeding-program loads every kennel from BigQuery when it starts, and its build needs the
#   internet (base image, packages); the replica's egress block stops both.
# No verify list: none of the three publishes a web port.
[replica]
of = "d01"
start_apps = true
apps = ["media", "calibre", "duplicati"]
exclude_secrets = ["D01_CLOUDFLARED_ENV"]   # the tunnel token; see cloudflared above
