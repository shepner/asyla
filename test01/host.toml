# test01: the build test host (asyla hub decisions/host-layout.md, decision 4). Created and
# destroyed as testing needs (operator pre-approved for test01 only, 2026-10-13).
# The ns02 proof (asyla backlog 2026-10-09-hosts-move-ns01-and-ns02-to-the-gitlab-host-path):
# test01 built the way the new ns02 would be, as a replica of the ns02 spec (build/setup/ with
# dns_port.sh), restoring Pi-hole from ns02's NAS mirror and starting it, so that pihole.sh verify
# runs on a real host (scripts/build_host.py docstring, Replica; [replica].app_verify). Pi-hole's
# DHCP guard keeps dhcp.active false on any host but ns01, and verify checks it: the replica never
# serves DHCP. No [runner], [gitlab_runner] or [[external]]: a replica reaches nothing off the LAN.
# This commit is reverted after the proof, which brings back the hello test.
[vm]
node = "vmh01"             # the default; either node may carry it: build_host.py test01 build --node vmh02
vmid = 901                 # a block of its own, away from the Docker hosts (101 up)
sockets = 1
cores = 2                  # as the new ns02 (ns02/host.toml)
memory_mb = 4096           # as the new ns02
ip = "10.0.0.69/24"
os_disk = { storage = "local-data2", size = "32G" }     # as the new ns02; local-data2 exists on both nodes
data_disk = { storage = "local-data2", size = "16G" }   # /mnt/docker: as the new ns02
cloudinit_storage = "local-data2"
disposable = true          # build_host.py may destroy and recreate it without --confirm
startup = "order=90"       # after every production VM when a node boots; set at create, checked by verify

[setup]
steps = ["systemConfig.sh", "nfs.sh", "docker.sh", "bashrc.sh", "dns_port.sh"]   # build/setup/: ns02's steps

# host-maintenance's key set, test01's own (the replica keeps it; ns02 has no [host_maintenance] of
# its own to take), with its own throwaway key TEST01_HOST_MAINTENANCE_SSH_KEY: build/setup/
# host_maintenance_keys.sh reads test01/host.toml alone, so the identity must be one of test01's own
# [[secret]]s. self_address is test01's own address, never ns02's.
[[secret]]
var = "TEST01_HOST_MAINTENANCE_SSH_KEY"
path = "/home/docker/.config/host-maintenance/ssh/id_ed25519"
owner = "docker:docker"
mode = "600"

[host_maintenance]
identity = "/home/docker/.config/host-maintenance/ssh/id_ed25519"
user = "docker"
known_hosts = [
  "10.0.0.60 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDklyJ5JfOrunGhBVq3B00PFofICXisn2NryUP5yvA5D",
  "10.0.0.61 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK+LjU+hfw8ZMCCFIDeMIXfut12jX3Njl+MDDZ/RG5qq",
  # 10.0.0.62: the rebuilt d03 (VM 113, cutover 2026-10-17); VM 103's key was ...bhhGgU9S.
  "10.0.0.62 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEWBYkIF2Vt24oPKu01VJPEExr3WzbsWyMjahtuYpaak",
]
self_address = "10.0.0.69"

# Pi-hole restored from ns02's mirror and started (host network: it answers on 10.0.0.69:53, which
# no client is given). app_verify: verify runs pihole.sh verify, which knows a replica: local
# answers (a CNAME from the restored config, a hosts-file name), dhcp.active false, wpad, the
# allowlist; outside names are not checked (egress blocked).
[replica]
of = "ns02"
start_apps = true
apps = ["pihole"]
app_verify = ["pihole"]
