# test01: the build test host (asyla hub decisions/host-layout.md, decision 4). Created and
# destroyed as testing needs (operator pre-approved for test01 only, 2026-10-13). Its runners
# carry only the label or tag build-test, so they never take a real job.
# Gap G1 (asyla backlog): a d03 replica restoring Gitea only, from its NAS backup, with no way to
# write outward (scripts/build_host.py docstring, Replica). The hello test is in git history
# (226904e) and comes back after the G1 proof.
[vm]
node = "vmh01"             # the default; either node may carry it: build_host.py test01 build --node vmh02
vmid = 901                 # a block of its own, away from the Docker hosts (101 up)
sockets = 1
cores = 4
memory_mb = 8192
ip = "10.0.0.69/24"
os_disk = { storage = "local-data2", size = "32G" }     # local-data2 exists on both nodes
data_disk = { storage = "local-data2", size = "64G" }   # /mnt/docker: room for the restored Gitea (gap G1)
cloudinit_storage = "local-data2"
disposable = true          # build_host.py may destroy and recreate it without --confirm
startup = "order=90"       # after every production VM when a node boots; set at create, checked by verify

[setup]
steps = ["systemConfig.sh", "nfs.sh", "docker.sh", "bashrc.sh"]   # build/setup/, sent by the build

# No [runner], [gitlab_runner] or [host_maintenance]: a replica reaches nothing off the LAN.
[replica]
of = "d03"
apps = ["gitea"]
# Every d03 secret: Gitea's own are inside its restored data (app.ini).
exclude_secrets = [
  "D03_BREEDING_RESEARCH_ENV", "D03_TC_DATALOGGER_ENV", "D03_BREEDING_RESEARCH_GCP_CREDENTIALS_JSON",
  "D03_CLOUDFLARED_ENV", "D03_INTERNAL_PROXY_ENV", "D03_MS_PROCEDURAL_BACKUP_ENV",
  "D03_MS_CHRONICLE_BACKUP_ENV", "D03_DOCKER_CONFIG_JSON", "D03_HOST_MAINTENANCE_SSH_KEY",
]
verify = ["http://{ip}:3000/api/healthz", "http://{ip}:3000/api/v1/version"]

# Into the restored app.ini before the first start. In Gitea 1.27.3 [cron] ENABLED does not stop
# the tasks (routers/init.go calls cron.Init unconditionally): each outbound task is switched off
# by its own section. The webhook allow-list falls back to [security], so both name a host that
# cannot exist (.invalid, RFC 2606).
[replica.gitea_config."cron.update_mirrors"]
ENABLED = false
[replica.gitea_config."cron.update_checker"]
ENABLED = false
[replica.gitea_config."cron.sync_external_users"]
ENABLED = false
[replica.gitea_config.mirror]
ENABLED = false
[replica.gitea_config.mailer]
ENABLED = false
[replica.gitea_config.actions]
ENABLED = false
[replica.gitea_config.webhook]
ALLOWED_HOST_LIST = "webhook-delivery-disabled.invalid"
[replica.gitea_config.security]
ALLOWED_HOST_LIST = "webhook-delivery-disabled.invalid"
