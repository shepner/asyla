# test01: the build test host (asyla hub decisions/host-layout.md, decision 4). Created and
# destroyed as testing needs (operator pre-approved for test01 only, 2026-10-13).
# The d02 proof (asyla backlog 2026-10-18-hosts-d02-replace-with-a-new-vm-built-by-build-host-py-build-new-c):
# test01 built the way the new d02 would be, as a d02 replica of the new d02 spec (build/setup/, not
# d02/setup/), restoring Plex's 291G from d02's NAS mirror, timed, and starting nothing
# (scripts/build_host.py docstring, Replica). No [runner], [gitlab_runner] or [[external]]: a replica
# reaches nothing off the LAN. No smb.sh: the NAS media share is d02's own mount, and smb.sh refuses a
# replica. This commit is reverted after the proof, which brings back the hello test.
[vm]
node = "vmh01"             # the default; either node may carry it: build_host.py test01 build --node vmh02
vmid = 901                 # a block of its own, away from the Docker hosts (101 up)
sockets = 1
cores = 12                 # as the new d02 (d02/host.toml)
memory_mb = 16384          # as the new d02
ip = "10.0.0.69/24"
os_disk = { storage = "local-data2", size = "64G" }     # as the new d02; local-data2 exists on both nodes
data_disk = { storage = "local-data1", size = "512G" }  # /mnt/docker: as the new d02 (vmh01 local-data1 824G free, 2026-10-18)
cloudinit_storage = "local-data2"
disposable = true          # build_host.py may destroy and recreate it without --confirm
startup = "order=90"       # after every production VM when a node boots; set at create, checked by verify

[setup]
steps = ["systemConfig.sh", "nfs.sh", "docker.sh", "bashrc.sh"]   # build/setup/, sent by the build; no smb.sh

# host-maintenance's key set, test01's own (the replica keeps it; d02 has no [host_maintenance] of
# its own to take), with its own throwaway key TEST01_HOST_MAINTENANCE_SSH_KEY: build/setup/
# host_maintenance_keys.sh reads test01/host.toml alone, so the identity must be one of test01's own
# [[secret]]s. self_address is test01's own address, never d02's.
[[secret]]
var = "TEST01_HOST_MAINTENANCE_SSH_KEY"
path = "/home/docker/.config/host-maintenance/ssh/id_ed25519"
owner = "docker:docker"
mode = "600"

[host_maintenance]
identity = "/home/docker/.config/host-maintenance/ssh/id_ed25519"
user = "docker"
known_hosts = [
  "10.0.0.60 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDklyJ5JfOrunGhBVq3B00PFofICXisn2NryUP5yvA5D",
  "10.0.0.61 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPbeDGfZcftzPaZaKINRYpCqTWWPB8e5rgJQsoEVBvz8",
  # 10.0.0.62: the rebuilt d03 (VM 113, cutover 2026-10-17); VM 103's key was ...bhhGgU9S.
  "10.0.0.62 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEWBYkIF2Vt24oPKu01VJPEExr3WzbsWyMjahtuYpaak",
]
self_address = "10.0.0.69"

# Plex is restored but never started: with network_mode host it would announce a second server with
# d02's identity (the restored Preferences.xml) on the LAN (GDM), which the egress block lets through.
# start_apps = false: the apps phase starts nothing and verify checks that no container runs.
# D02_SMBCREDENTIALS is excluded: unused here (no smb.sh), and the proof does not wait on its store.
[replica]
of = "d02"
start_apps = false
apps = ["plex"]
exclude_secrets = ["D02_SMBCREDENTIALS"]   # unused here (no smb.sh), so the proof does not wait on that secret's store
