# test01: the build test host (asyla hub decisions/host-layout.md, decision 4). Created and
# destroyed as testing needs (operator pre-approved for test01 only, 2026-10-13). Its runners
# carry only the label or tag build-test, so they never take a real job.
# The hello test (test01/apps/hello). To rehearse a production host instead, add
# [replica] of = "dNN" (scripts/build_host.py docstring; the d03 replica of 2026-10-09 is in git
# history under d04/, 4decdd6..fad6650).
[vm]
node = "vmh01"             # the default; either node may carry it: build_host.py test01 build --node vmh02
vmid = 901                 # a block of its own, away from the Docker hosts (101 up)
sockets = 1
cores = 4
memory_mb = 8192
ip = "10.0.0.69/24"
os_disk = { storage = "local-data2", size = "32G" }     # local-data2 exists on both nodes
data_disk = { storage = "local-data2", size = "16G" }   # /mnt/docker
cloudinit_storage = "local-data2"
disposable = true          # build_host.py may destroy and recreate it without --confirm
startup = "order=90"       # after every production VM when a node boots; set at create, checked by verify

[setup]
steps = ["systemConfig.sh", "nfs.sh", "docker.sh", "bashrc.sh"]   # build/setup/, sent by the build

[[secret]]
var = "TEST01_HELLO_ENV"
path = "/home/docker/scripts/test01/apps/hello/.env"
owner = "docker:asyla"
mode = "600"

[[app]]
name = "hello"
verify = ["verify"]

[runner]
enabled = true
labels = ["build-test"]    # one label no workflow uses (docker/gitea-runner/gitea-runner.sh)

# GitLab runners (build/gitlab-runner/gitlab-runner.sh, run by the build's runner phase); one
# [[gitlab_runner.runners]] table each. GitLab description test01-build; tag build-test only, and
# untagged jobs off, so it never takes a job.
[[gitlab_runner.runners]]
name = "build"
scope = "group:asyla"
tags = ["build-test"]
executor = "docker"
image = "python:3.12-alpine"
volumes = []
pull_policy = "if-not-present"
