# d05 build spec, read by scripts/build_host.py: theOrg's secrets and identity host (asyla hub
# decisions/host-layout.md, Decision 1, 2026-10-13: "d05 secrets and identity"). First tenant:
# theOrg's Keycloak (identity-platform, realm theorg, https://id.asyla.org), its keycloak-db and the
# openldap it federates, moved from the Mac Mini (theOrg decisions/service-placement.md, Amendment
# 2026-11-10; asyla hub backlog 2026-11-09-d05-deploy-theorg-s-keycloak-keycloak-db-and-openldap-on-d05).
# OpenBao (secrets-vault) and step-ca (certificate-management) follow when theOrg moves them (asyla
# hub backlog 2026-10-17-hosts-d05-build-it-and-move-theorg-s-openbao-and-step-ca-onto-it-a).
# Built as every other Docker host (host-layout decision 6). d05 is not disposable: a build or a
# destroy needs --confirm d05 and the operator's approval of the exact action.
# The identity-platform [[app]] is from theOrg identity-platform DEPLOY.md "Production on d05" at
# 701e893 (main, the #82 merge), carried to 47f65add, fcbed3fe and 5dd8de6 (main, the #88 merge),
# M1 only: keycloak-db alone
# (d05/apps/identity-platform/README.md).
# No [[external]] yet: the proxy (internal-access hosts/d05) and the tunnel (external-access
# hosts/d05, one public name, id.asyla.org, outside Access) are added when theOrg declares them.
# No runner: host-layout's rule for this host is no general job runner (only jobs naming d05).

# vmh02, so the vault and identity host is not on the forge's node (d04 is on vmh01; host-layout
# Sizes). VMID and address follow the dNN pattern (d04 104 .63, d06 106 .65, d07 107 .66).
# Size: host-layout's d05 row (2 cores, 4 GiB, 32G + 16G); RAM and cores change with a restart.
# order=22: after d01 (20), before d02 (25), when vmh02 boots.
[vm]
node = "vmh02"
vmid = 105
sockets = 1
cores = 2
memory_mb = 4096
ip = "10.0.0.64/24"
os_disk = { storage = "local-data2", size = "32G" }
data_disk = { storage = "local-data2", size = "16G" }   # /mnt/docker: theOrg's stacks' data (0.2 GB on the Mini)
cloudinit_storage = "local-data2"
startup = "order=22"                                    # set at create, checked by verify

[setup]
steps = ["systemConfig.sh", "nfs.sh", "docker.sh", "container_dns.sh", "bashrc.sh", "node_exporter.sh"]   # build/setup/, sent by the build

# Node exporter (build/setup/node_exporter.sh) for theOrg's trends Prometheus (asyla standard
# ASY-TRD), as d07: port 9100 from the LAN only. theOrg adds a scrape job asyla-d05-node (a hand-off).
[node_exporter]
allow = ["10.0.0.0/24"]    # a subnet, not a host (operator, 2026-10-25): the trends Prometheus can move

# No [[secret]]: d05 keeps no secret on disk, like d06 and d07. Every credential is a start_env or
# [[external]] env value, resolved from OpenBao on the workstation and sent over SSH stdin at use.

# theOrg's identity-platform (d05/apps/identity-platform; DEPLOY.md "Production on d05" at 5dd8de6),
# M1: its networks, images and root CA, and keycloak-db alone; openldap and keycloak start only at
# the M5 cutover, after a restore. Values the workstation resolves from OpenBao and sends over SSH
# stdin at use (build_host.py, App environment): the theorg-registry pull token for the image pulls
# (as IDENTITY_PLATFORM_REGISTRY_PULL_TOKEN), keycloak-db's password, which up needs, and the LDAP
# admin's, which up needs once cutover-done exists (it then starts keycloak-db, openldap and
# keycloak together and refuses, starting nothing, without both); before cutover-done up unsets it
# and starts keycloak-db alone. The deploy Dex client value is not sent: only configure takes it,
# on stdin (switch_env). No restore: M1 holds no data of its own, and identity-platform.sh restore
# refuses (the M5 cutover's), which would stop the build. Its images are pinned
# (IDENTITY_PLATFORM_TAG and digests), so up's pull of missing images is the only pull it needs.
# A replica (test01 as [replica] of = "d05") needs no key here, as d06's ticketing: build_host.py
# finds identity-platform.sh's images switch for its image pull, and up, on a host not named d05,
# starts keycloak-db with a throwaway password (a replica gets no start_env).
# LDAP_PROVISIONER_PASSWORD (step-ca's `ldap` provisioner, for identity-platform.sh leaf-issue) is
# not in start_env on purpose: start runs `up`, which must never get it or issue. build_host.py has
# no one-off app command with its own values; the operator runs the leaf switches with
# scripts/app_switch.sh, which allows only the switches in switch_env (SWITCH -> a list of at most
# two names: the values it writes to ssh stdin, one line each in the list's order, read by the app
# script itself; nothing is exported on the host; build_host.py does not read this key). A build never issues or renews.
[[app]]
name = "identity-platform"
start = ["up"]
verify = ["verify"]
restore = false
pull_token_env = "THEORG_REGISTRY_PULL_TOKEN"
start_env = ["IDP_KEYCLOAK_DB_PASSWORD", "IDP_LDAP_ADMIN_PASSWORD"]
# switch_args (scripts/app_switch.sh): SWITCH -> one anchored pattern per plain ARG; a switch not in
# it takes no ARG. The M5 cutover bundle (theOrg deploy/d05/CUTOVER-BUNDLE.md, asyla #654):
# fetch-bundle takes the theorg-registry pull token on ssh stdin and the package version as its one
# ARG. unpack-bundle takes the age identity on ssh stdin and pack's three sha256 lines as ARGs
# (manifests-sha256, keycloak-summary-sha256, openldap-summary-sha256, in that order). reset-cutover
# and cutover-clean take no value and no ARG. The restores (cutover step 5) take no ARG:
# restore-keycloak takes keycloak-db's password on ssh stdin (the name up reads; keycloak-backup gets
# it on its stdin), restore-openldap no value. The build's restore stays false: identity-platform.sh
# restore refuses (exit 1) and points at these two. configure (cutover step 6) takes two values, no
# ARG: the LDAP admin's password, then the deploy Dex client's secret, one line each on ssh stdin;
# keycloak-configure gets both on its stdin. count-check (cutover step 7; keycloak-db's password
# comes from the running container) and cutover-done (after the cutover's verification) take no
# value and no ARG. After a rebuild (asyla #1101), restore-mirror restores both copies from the NAS
# mirror instead of the bundle: no value (keycloak-db's password comes from the running container)
# and no ARG; restore-mirror-accept-age is the same switch with the 48-hour age check off (a second
# name, not an ARG, so switch_args stays exact). mirror-check then compares fresh summaries with the
# restored ones: no value (keycloak-db's password comes from the running container), no ARG.
switch_env = { "leaf-issue" = ["LDAP_PROVISIONER_PASSWORD"], "leaf-renew" = [], "leaf-schedule-install" = [], "leaf-schedule-status" = [], "leaf-schedule-remove" = [], "fetch-bundle" = ["THEORG_REGISTRY_PULL_TOKEN"], "unpack-bundle" = ["IDP_CUTOVER_BUNDLE_IDENTITY"], "reset-cutover" = [], "cutover-clean" = [], "restore-keycloak" = ["IDP_KEYCLOAK_DB_PASSWORD"], "restore-openldap" = [], "start-openldap" = ["IDP_LDAP_ADMIN_PASSWORD"], "start-keycloak" = ["IDP_KEYCLOAK_DB_PASSWORD"], "configure" = ["IDP_LDAP_ADMIN_PASSWORD", "IDP_DEPLOY_DEX_CLIENT_SECRET"], "count-check" = [], "cutover-done" = [], "restore-mirror" = [], "restore-mirror-accept-age" = [], "mirror-check" = [] }
switch_args = { "fetch-bundle" = ['^m5-[0-9a-f]{12}$'], "unpack-bundle" = ['^[0-9a-f]{64}$', '^[0-9a-f]{64}$', '^[0-9a-f]{64}$'] }
